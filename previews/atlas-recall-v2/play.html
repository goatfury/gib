<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Recall</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c}
iframe{display:block;width:100%;height:100%;border:0}
#status{position:fixed;left:50%;top:18px;z-index:20;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#101a2c;color:#f4f7ff;font:700 13px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#status.show{opacity:1}
</style>
</head>
<body>
<div id="status" role="status" aria-live="polite"></div>
<iframe id="app" title="Atlas Recall" src="index.html"></iframe>
<script>
const frame=document.getElementById('app');
const status=document.getElementById('status');
let attempts=0;
function showStatus(message){status.textContent=message;status.classList.add('show')}
function loadInto(doc,src,label){
  return new Promise((resolve,reject)=>{
    const script=doc.createElement('script');
    script.src=src;
    script.onload=resolve;
    script.onerror=()=>reject(new Error(label+' failed to load'));
    doc.body.appendChild(script);
  });
}
async function wire(){
  attempts+=1;
  let doc,win;
  try{doc=frame.contentDocument;win=frame.contentWindow}catch(error){}
  if(!doc||!win||doc.readyState!=='complete'||!doc.getElementById('freePanel')||!doc.getElementById('answerInput')){
    if(attempts<300)setTimeout(wire,60);else showStatus('Atlas Recall loaded, but the learning controls did not initialize.');
    return;
  }
  const probe=doc.createElement('script');
  probe.textContent="window.__atlasRuntimeReady=(typeof state==='object'&&typeof CAPITALS==='object'&&typeof capitalMatch==='function'&&typeof beginCapitalPrompt==='function');";
  doc.body.appendChild(probe);
  probe.remove();
  if(!win.__atlasRuntimeReady){setTimeout(wire,60);return}
  if(win.__atlasReliableLauncherReady)return;
  win.__atlasReliableLauncherReady=true;
  try{
    await loadInto(doc,'one-field-learning.js?v=cf73d511','One-field learning');
    await loadInto(doc,'end-answer-key.js?v=10dc0782','End answer key');
    await loadInto(doc,'letter-hints.js?v=cecbe7b2','Letter hints');
    const hint=doc.getElementById('oddHintBtn');
    if(hint){hint.textContent='Hint';hint.title='First letter, then second letter'}
    doc.body.dataset.launcher='html-v1';
  }catch(error){
    showStatus(error.message+'. Refresh once; if it persists, this build is broken.');
    doc.body.dataset.launcherError=error.message;
  }
}
frame.addEventListener('load',()=>{attempts=0;setTimeout(wire,20)});
setTimeout(wire,20);
</script>
</body>
</html>
