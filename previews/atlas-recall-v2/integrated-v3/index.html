<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Recall — loading</title><style>html,body{margin:0;height:100%;background:#07101c;color:#f4f7ff;font:16px system-ui;display:grid;place-items:center}.l{opacity:.72}</style><div class="l">Loading Atlas Recall…</div><script>
const parts=["part-00.b64","part-01.b64","part-02.b64","part-03.b64"];
Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p);return r.text()}))).then(async xs=>{const raw=atob(xs.join(''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}).catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap">Preview failed to load: '+e+'</pre>');
</script>
