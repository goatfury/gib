<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Atlas Recall — World Country Quiz</title>
<style>
:root{
  --bg:#07101c;
  --bg-2:#0b1525;
  --panel:rgba(15,24,41,.93);

  --muted:#8d9ab4;
  --faint:#5f6c85;
  --line:rgba(184,201,234,.14);
  --line-strong:rgba(184,201,234,.26);
  --ocean:#071d30;
  --land:#2b3951;
  --land-stroke:#0d1828;
  --accent:#8c7cff;
  --accent-2:#b4aaff;
  --accent-soft:rgba(140,124,255,.16);
  --cyan:#4adfff;
  --cyan-soft:rgba(74,223,255,.15);
  --success:#4df0b2;
  --success-2:#2bd8e8;
  --success-soft:rgba(77,240,178,.14);
  --danger:#ff647d;
  --danger-soft:rgba(255,100,125,.14);
  --warning:#ffc864;
  --warning-soft:rgba(255,200,100,.15);
  --shadow:0 24px 70px rgba(0,0,0,.34);
  --shadow-soft:0 12px 34px rgba(0,0,0,.24);
  --radius:20px;
  --radius-sm:12px;
}
[data-theme="light"]{
  --bg:#eaf0f8;
  --bg-2:#f7f9fd;
  --panel:rgba(255,255,255,.94);
  --panel-solid:#ffffff;
  --panel-2:#f2f5fb;
  --panel-3:#e9eef7;
  --ink:#172136;
  --muted:#68758d;
  --faint:#8c98aa;
  --line:rgba(50,69,103,.14);
  --line-strong:rgba(50,69,103,.25);
  --ocean:#c9e8f7;
  --land:#d4dde9;
  --land-stroke:#f7f9fc;
  --accent:#6758e8;
  --accent-2:#4c3ec8;
  --accent-soft:rgba(103,88,232,.13);
  --cyan:#0ea8c8;
  --cyan-soft:rgba(14,168,200,.12);
  --success:#11895f;
  --success-2:#0995ad;
  --success-soft:rgba(17,137,95,.12);
  --danger:#cf425a;
  --danger-soft:rgba(207,66,90,.12);
  --warning:#a9660c;
  --warning-soft:rgba(169,102,12,.12);
  --shadow:0 22px 60px rgba(42,58,91,.15);

}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden;line-height:1.4}
body::before{
  content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(circle at 8% -10%,rgba(140,124,255,.24),transparent 31%),
    radial-gradient(circle at 92% 6%,rgba(74,223,255,.14),transparent 25%),
    radial-gradient(circle at 74% 105%,rgba(77,240,178,.11),transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
}
body::after{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 76%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--cyan) 45%,transparent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important}
.game-screen{height:100dvh;min-height:640px;max-width:1880px;margin:0 auto;padding:12px 16px 16px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;overflow:hidden}
.panel{background:linear-gradient(165deg,color-mix(in srgb,var(--panel) 96%,transparent),color-mix(in srgb,var(--panel-solid) 92%,transparent));border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(18px)}
.hud{min-height:72px;display:grid;grid-template-columns:minmax(210px,.7fr) minmax(620px,1.9fr) auto;gap:14px;align-items:center;padding:8px 10px 8px 14px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-soft);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:45px;height:45px;position:relative;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,var(--accent),var(--cyan));box-shadow:0 10px 28px rgba(100,95,245,.34);overflow:hidden}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;border:1.5px solid rgba(255,255,255,.68);border-radius:50%}
.brand-mark::before{width:25px;height:25px}.brand-mark::after{width:9px;height:29px;border-top:0;border-bottom:0}
.brand-mark span{width:29px;height:1.5px;background:rgba(255,255,255,.7);box-shadow:0 -7px 0 rgba(255,255,255,.5),0 7px 0 rgba(255,255,255,.5)}
.eyebrow{margin:0;color:var(--cyan);font-weight:900;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase}
h1{margin:1px 0 0;font-size:1.35rem;line-height:1.05;letter-spacing:-.04em;white-space:nowrap}
.brand-sub{margin-top:2px;color:var(--muted);font-size:.66rem;white-space:nowrap}
.hud-stats{display:grid;grid-template-columns:1.05fr .9fr .98fr .96fr .98fr;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--panel-2) 82%,transparent)}
.stat{position:relative;min-width:0;padding:7px 11px;border-right:1px solid var(--line);overflow:hidden}.stat:last-child{border-right:0}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;transition:.2s}
.stat.hot::after{background:linear-gradient(90deg,var(--warning),var(--danger),var(--accent));box-shadow:0 0 13px var(--warning)}
.stat-label{color:var(--muted);font-size:.58rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.stat-value{margin-top:1px;font-size:1.08rem;line-height:1.08;font-weight:950;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}

.hud-actions{display:flex;justify-content:flex-end;gap:6px;white-space:nowrap}
.btn,.icon-btn,.primary,.danger-btn{border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink);padding:8px 11px;font-weight:820;font-size:.76rem;line-height:1.1;transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease,filter .14s ease}
.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:var(--line-strong);background:var(--panel-3)}
.icon-btn{min-width:38px;padding:8px 9px}
.primary{border-color:color-mix(in srgb,var(--accent) 78%,var(--line));color:#fff;background:linear-gradient(135deg,var(--accent),#5a8cff);box-shadow:0 8px 22px rgba(99,91,236,.28)}
.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.danger-btn{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}
.danger-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.arena{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,410px);gap:12px}
.map-card{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.panel-head{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 6px 15px}
.panel-title{display:flex;align-items:baseline;gap:9px;min-width:0}.panel-title h2{font-size:.9rem;margin:0}.panel-title span{color:var(--muted);font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-tools{display:flex;align-items:center;gap:5px}.map-tools select{max-width:135px}
.map-tools .icon-btn{width:31px;height:31px;padding:0;display:grid;place-items:center;border-radius:9px}
select,input[type="text"]{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;outline:none;transition:border-color .16s,box-shadow .16s,background .16s}
select{padding:8px 29px 8px 9px;font-size:.72rem;font-weight:760}
select:focus,input[type="text"]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft);background:var(--panel-solid)}
.map-stage{position:relative;flex:1;min-height:0;padding:0 7px 8px}
#worldMap{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 51% 42%,color-mix(in srgb,var(--ocean) 86%,#164968),var(--ocean) 72%);touch-action:none;cursor:grab;user-select:none}
#worldMap.panning{cursor:grabbing}
.country-shape{fill:var(--land);stroke:var(--land-stroke);stroke-width:.72;vector-effect:non-scaling-stroke;transition:fill .2s,opacity .2s,filter .2s;transform-box:fill-box;transform-origin:center;cursor:zoom-in}
.country-shape.inactive{opacity:.2}.country-shape.target{opacity:1}.country-shape.guessed{fill:var(--success)}.country-shape.missed{fill:var(--danger)}
.country-shape.guessed:hover,.country-shape.missed:hover{filter:brightness(1.12)}
.country-marker{pointer-events:auto;cursor:zoom-in}.marker-halo{fill:var(--panel-solid);stroke:var(--line-strong);stroke-width:1.3;vector-effect:non-scaling-stroke}.marker-core{fill:var(--land);stroke:var(--land-stroke);stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .2s,opacity .2s;transform-box:fill-box;transform-origin:center}
.country-marker.inactive{opacity:.22}.country-marker.guessed .marker-core{fill:var(--success)}.country-marker.missed .marker-core{fill:var(--danger)}
.country-shape.just-guessed{animation:country-pop .58s cubic-bezier(.2,.85,.2,1)}
.country-marker.just-guessed .marker-core{animation:marker-pop .58s cubic-bezier(.2,.85,.2,1)}
@keyframes country-pop{0%{filter:brightness(1);transform:scale(1)}35%{filter:brightness(1.75) drop-shadow(0 0 9px var(--success));transform:scale(1.055)}100%{filter:brightness(1);transform:scale(1)}}
@keyframes marker-pop{0%{transform:scale(1)}35%{transform:scale(2.1);filter:drop-shadow(0 0 8px var(--success))}100%{transform:scale(1)}}
.map-overlay{position:absolute;z-index:4;pointer-events:none}
.map-legend{left:19px;bottom:19px;display:flex;gap:10px;flex-wrap:wrap;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 90%,transparent);box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);font-size:.64rem;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:5px}.legend-dot{width:8px;height:8px;border-radius:50%;background:var(--land);border:1px solid var(--line-strong)}.legend-dot.g{background:var(--success);border:0}.legend-dot.m{background:var(--danger);border:0}
.zoom-readout{right:18px;bottom:18px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--muted);font-size:.62rem;font-weight:820;backdrop-filter:blur(10px)}
.hit-burst{left:50%;bottom:32px;min-width:230px;max-width:min(520px,70%);padding:10px 16px;text-align:center;border:1px solid color-mix(in srgb,var(--success) 42%,var(--line));border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--panel-solid) 94%,transparent),color-mix(in srgb,var(--success-soft) 92%,transparent));box-shadow:0 18px 48px rgba(0,0,0,.34),0 0 28px rgba(77,240,178,.12);opacity:0;transform:translate(-50%,16px) scale(.94);transition:none;backdrop-filter:blur(16px)}
.hit-burst.show{animation:hit-burst .72s cubic-bezier(.2,.9,.2,1) forwards}
.hit-kicker{display:block;color:var(--success);font-size:.58rem;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.hit-name{display:block;margin:2px 0 1px;font-size:clamp(1.1rem,2.4vw,1.65rem);line-height:1.08;letter-spacing:-.04em}.hit-meta{display:block;color:var(--muted);font-size:.7rem;font-weight:740}
@keyframes hit-burst{0%{opacity:0;transform:translate(-50%,18px) scale(.9)}18%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(1.02)}}
.milestone-banner{left:50%;top:20px;max-width:75%;padding:9px 16px;text-align:center;border:1px solid color-mix(in srgb,var(--warning) 46%,var(--line));border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--panel-solid) 94%,transparent),var(--warning-soft),color-mix(in srgb,var(--panel-solid) 94%,transparent));box-shadow:0 14px 42px rgba(0,0,0,.28);font-size:.75rem;font-weight:920;letter-spacing:.04em;opacity:0;transform:translate(-50%,-14px) scale(.95);backdrop-filter:blur(12px)}
.milestone-banner.show{animation:milestone 2s cubic-bezier(.2,.8,.2,1) forwards}@keyframes milestone{0%{opacity:0;transform:translate(-50%,-14px) scale(.94)}12%,76%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-6px) scale(1)}}
.console{min-height:0;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.setup{padding:0 0 9px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(100px,.7fr);gap:7px}.control{min-width:0}.control label{display:block;margin:0 0 4px;color:var(--muted);font-size:.58rem;font-weight:900;letter-spacing:.085em;text-transform:uppercase}.control select{width:100%}
#regionControl{margin-top:7px}#regionControl[hidden]{display:none}
.memory-picks{display:flex;align-items:center;gap:5px;margin-top:6px;min-width:0}
.memory-picks-label{flex:0 0 auto;color:var(--muted);font-size:.55rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.memory-pick{min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--muted);font-size:.6rem;font-weight:860;line-height:1;white-space:nowrap;transition:transform .14s ease,border-color .14s ease,background .14s ease,color .14s ease}
.memory-pick:hover{transform:translateY(-1px);border-color:var(--line-strong);color:var(--ink);background:var(--panel-3)}
.memory-pick.active{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 58%,var(--line));background:linear-gradient(135deg,var(--accent-soft),var(--cyan-soft));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 12%,transparent)}
.memory-pick b{margin-left:3px;color:var(--cyan);font-size:.55rem}
.setup-row{display:flex;align-items:center;gap:6px;margin-top:8px}.setup-row .primary{flex:1;padding:9px 12px}.setup-row .btn{padding:9px 10px}
.advanced{margin-left:auto;position:relative}.advanced summary{list-style:none;cursor:pointer;color:var(--muted);font-size:.66rem;font-weight:800}.advanced summary::-webkit-details-marker{display:none}.advanced summary::before{content:"＋";margin-right:3px}.advanced[open] summary::before{content:"−"}.advanced-body{position:absolute;right:13px;z-index:10;margin-top:6px;width:230px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);box-shadow:var(--shadow)}
.mode-note{margin-top:6px;color:var(--muted);font-size:.68rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round-state{display:flex;align-items:center;gap:8px;min-height:20px;margin-bottom:7px;color:var(--muted);font-size:.7rem;font-weight:760}.status-light{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--faint)}.status-light.live{background:var(--success);box-shadow:0 0 0 4px var(--success-soft),0 0 14px var(--success)}.status-light.paused{background:var(--warning);box-shadow:0 0 0 4px var(--warning-soft)}
.answer-label{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-bottom:6px}.answer-label strong{font-size:.88rem}.assist-badge{display:inline-flex;align-items:center;gap:5px;color:var(--success);font-size:.6rem;font-weight:880;letter-spacing:.04em;text-transform:uppercase}.assist-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success)}
.answer-shell{position:relative;border-radius:15px;transition:box-shadow .18s,transform .18s}
.answer-shell input{width:100%;padding:14px 48px 14px 14px;border-radius:14px;background:linear-gradient(145deg,var(--panel-2),color-mix(in srgb,var(--panel-solid) 82%,var(--panel-2)));font-size:1.08rem;font-weight:820;letter-spacing:-.015em}
.answer-shell::after{content:"↵";position:absolute;right:11px;top:50%;transform:translateY(-50%);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--panel-solid);font-size:.62rem;font-weight:800}
.answer-shell.success-pulse{animation:input-success .48s ease}.answer-shell.shake{animation:error-shake .36s cubic-bezier(.36,.07,.19,.97) both}
@keyframes input-success{0%{box-shadow:0 0 0 0 transparent}45%{box-shadow:0 0 0 4px var(--success-soft),0 0 24px rgba(77,240,178,.23)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes error-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-.4deg);box-shadow:0 0 0 3px var(--danger-soft)}40%{transform:translateX(6px) rotate(.4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.match-cue{height:23px;display:flex;align-items:center;gap:6px;padding:4px 2px 0;color:var(--muted);font-size:.67rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.match-cue::before{content:"";width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--faint)}.match-cue.ready{color:var(--success)}.match-cue.ready::before{background:var(--success);box-shadow:0 0 9px var(--success)}.match-cue.close{color:var(--cyan)}.match-cue.close::before{background:var(--cyan)}.match-cue.warn{color:var(--warning)}.match-cue.warn::before{background:var(--warning)}
.feedback{min-height:37px;display:flex;align-items:center;margin:5px 0 7px;padding:7px 9px;border:1px solid transparent;border-radius:10px;background:var(--panel-2);color:var(--muted);font-size:.72rem}.feedback.good{color:var(--success);background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 20%,transparent)}.feedback.bad{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 22%,transparent)}.console.on-fire{box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--warning) 34%,transparent),0 0 38px rgba(255,137,80,.12)}.console.on-fire .answer-shell input{border-color:color-mix(in srgb,var(--warning) 55%,var(--line));box-shadow:0 0 20px rgba(255,178,74,.08)}
.free-panel.hidden{display:none}.ladder-panel{display:none}.ladder-panel.active{display:block}.ladder-kicker{color:var(--cyan);font-size:.6rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.ladder-clue{margin:4px 0 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(1.35rem,3vw,1.9rem);font-weight:950;letter-spacing:.09em;word-break:break-word}.ladder-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;color:var(--muted);font-size:.64rem}.ladder-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ladder-buttons button{padding:8px 6px;font-size:.68rem}.ladder-buttons .reveal{grid-column:span 2}
.round-actions{display:flex;gap:6px;margin-bottom:8px}.round-actions button{flex:1;padding:8px 7px;font-size:.69rem}
.console-lower{min-height:0;flex:1;overflow:auto;border-top:1px solid var(--line);padding-top:8px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.region-progress{display:grid;gap:5px;margin-bottom:9px}.region-row{display:grid;grid-template-columns:88px 1fr 37px;gap:7px;align-items:center;font-size:.64rem}.region-name{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:5px;border-radius:999px;background:var(--panel-3);overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .25s}.region-count{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.lower-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.lower-head h3{margin:0;font-size:.69rem}.lower-head span{color:var(--muted);font-size:.61rem}.chips{display:flex;gap:5px;flex-wrap:wrap;min-height:27px}.chip{padding:4px 7px;border:1px solid color-mix(in srgb,var(--success) 22%,transparent);border-radius:999px;background:var(--success-soft);color:var(--success);font-size:.62rem;font-weight:790}.empty-note{color:var(--muted);font-size:.68rem}
.checklist-section{max-width:1880px;margin:0 auto;padding:38px 16px 72px;min-height:100vh}
