[build]
  command = "npm run check"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."warm-oil-data"]
  schedule = "17 10 * * *"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/fallback.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
