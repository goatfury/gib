<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>M1 Production Tablet Setup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f5f7; color: #17202a; }
    main { max-width: 620px; margin: 32px auto; padding: 24px; background: white; border-radius: 14px; box-shadow: 0 8px 28px #17202a1a; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .notice { padding: 12px; border: 1px solid #b8c4d0; border-radius: 8px; background: #f8fafc; }
    .status { margin-top: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>M1 production tablet setup</h1>
    <p class="notice">This one-time setup authorizes the production tablet without showing or storing a readable device secret. Auto-sync stays off.</p>
    <p id="statusMessage" class="status" role="status" aria-live="polite">Checking the one-time setup link...</p>
  </main>
  <script>
    (() => {
      'use strict';

      const EXPECTED_PATH = '/m1/tablet-install.html';
      const INSTALL_ENDPOINT = '/api/m1-tablet-install';
      const PRODUCTION_PROFILES = Object.freeze({
        'https://gib-live.netlify.app': Object.freeze({
          autoSyncKey: 'gib_m1_sync_auto_v1',
          preservedStateKeys: Object.freeze([
            'gib_m1_local_state_v2',
            'gib_m1_sync_queue_v1',
            'gib_m1_signins_v1'
          ])
        }),
        'https://gib-richmond-live.netlify.app': Object.freeze({
          autoSyncKey: 'gib_m1_richmond_production_sync_auto_v1',
          preservedStateKeys: Object.freeze([
            'gib_m1_richmond_production_local_state_v2',
            'gib_m1_richmond_production_sync_queue_v1',
            'gib_m1_richmond_production_signins_v1'
          ])
        })
      });
      const CAPABILITY_PATTERN = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$/;

      const status = message => {
        document.getElementById('statusMessage').textContent = message;
      };
      const exactKeys = (value, expected) => {
        if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
        const actual = Object.keys(value).sort();
        const wanted = [...expected].sort();
        return actual.length === wanted.length
          && actual.every((key, index) => key === wanted[index]);
      };
      const snapshotPreservedState = profile => {
        const snapshot = new Map();
        profile.preservedStateKeys.forEach(key => snapshot.set(key, localStorage.getItem(key)));
        return snapshot;
      };
      const preservedStateMatches = (profile, snapshot) => {
        return profile.preservedStateKeys.every(
          key => localStorage.getItem(key) === snapshot.get(key)
        );
      };
      const forceAutoSyncOff = (profile, snapshot) => {
        localStorage.setItem(profile.autoSyncKey, 'false');
        return localStorage.getItem(profile.autoSyncKey) === 'false'
          && preservedStateMatches(profile, snapshot);
      };

      const run = async () => {
        const initialOrigin = window.location.origin;
        const initialPath = window.location.pathname;
        const initialSearch = window.location.search;
        const profile = Object.hasOwn(PRODUCTION_PROFILES, initialOrigin)
          ? PRODUCTION_PROFILES[initialOrigin]
          : null;
        let capability = window.location.hash.startsWith('#')
          ? window.location.hash.slice(1)
          : '';

        try {
          window.history.replaceState(null, '', EXPECTED_PATH);
        } catch {
          capability = '';
          status('Installation was not completed.');
          return;
        }

        if (
          !profile
          || initialPath !== EXPECTED_PATH
          || initialSearch
        ) {
          capability = '';
          status('Installation is unavailable at this location.');
          return;
        }
        if (capability.length > 2_048 || !CAPABILITY_PATTERN.test(capability)) {
          capability = '';
          status('The one-time setup link was not accepted.');
          return;
        }

        let preservedState;
        try {
          preservedState = snapshotPreservedState(profile);
          if (!forceAutoSyncOff(profile, preservedState)) throw new Error('unsafe local state');
        } catch {
          capability = '';
          status('Installation stopped safely because auto-sync could not be confirmed OFF.');
          return;
        }

        let requestBody = JSON.stringify({ capability });
        capability = '';
        let response;
        try {
          response = await fetch(INSTALL_ENDPOINT, {
            method: 'POST',
            mode: 'same-origin',
            credentials: 'same-origin',
            cache: 'no-store',
            redirect: 'error',
            referrerPolicy: 'no-referrer',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: requestBody
          });
        } catch {
          status('Installation was not completed.');
          return;
        } finally {
          requestBody = '';
        }

        let result;
        try {
          const responseText = await response.text();
          if (!responseText || responseText.length > 2_048) throw new Error('invalid response');
          result = JSON.parse(responseText);
        } catch {
          status('Installation was not completed.');
          return;
        }

        if (
          response.ok !== true
          || !exactKeys(result, ['ok', 'installed'])
          || result.ok !== true
          || result.installed !== true
        ) {
          status('Installation was not completed.');
          return;
        }

        try {
          if (!forceAutoSyncOff(profile, preservedState)) throw new Error('unsafe local state');
        } catch {
          status('Installation stopped safely because auto-sync could not be confirmed OFF.');
          return;
        }
        status('Tablet authorization installed. Auto-sync is OFF.');
      };

      run().catch(() => status('Installation was not completed.'));
    })();
  </script>
</body>
</html>
