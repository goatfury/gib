<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07141b">
  <title>Atlantic Crossing Atlas</title>
  <style>
    html,body{height:100%;margin:0;background:#07141b;color:#d9e7ea;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center}
    main{width:min(520px,calc(100% - 40px));text-align:center}
    h1{margin:0 0 12px;font:500 34px/1.05 Georgia,serif;color:#f1e6ca}
    p{margin:0;color:#9fb7bf;line-height:1.5}
    .bar{height:2px;margin:24px 0;background:#183441;overflow:hidden}
    .bar:before{content:"";display:block;width:42%;height:100%;background:#e7b86b;animation:load 1.1s ease-in-out infinite alternate}
    @keyframes load{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
    .error{color:#e2a1a8}
  </style>
</head>
<body>
  <main>
    <h1>Atlantic Crossing Atlas</h1>
    <p id="status">Preparing the atlas…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script type="module">
    const parts = [
      'part-00.txt','part-01.txt','part-02.txt','part-03.txt',
      'part-04.txt','part-05.txt','part-06.txt'
    ];
    const expected = '60d73fb928dbc388183c35089cf11ff209136019d37abf9ab631fe87cda50cf5';
    const status = document.querySelector('#status');

    const hex = bytes => [...new Uint8Array(bytes)].map(v => v.toString(16).padStart(2,'0')).join('');

    try {
      if (!('DecompressionStream' in window)) throw new Error('This browser does not support the required decompression feature.');
      const responses = await Promise.all(parts.map(name => fetch(`./payload/${name}`, {cache:'no-store'})));
      for (const response of responses) if (!response.ok) throw new Error(`Atlas payload failed to load (${response.status}).`);
      const encoded = (await Promise.all(responses.map(response => response.text()))).join('').replace(/\s+/g,'');
      const binary = atob(encoded);
      const compressed = new Uint8Array(binary.length);
      for (let i=0;i<binary.length;i+=1) compressed[i] = binary.charCodeAt(i);
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      const digest = hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)));
      if (digest !== expected) throw new Error('Atlas integrity check failed.');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error(error);
      status.className = 'error';
      status.textContent = 'The atlas could not be loaded. Please refresh once.';
    }
  </script>
</body>
</html>
