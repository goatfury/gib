name: Atlas public QA

on:
  push:
    branches: [atlas-recall-v2-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1

      - name: Test exact public URL
        env:
          TARGET_URL: https://raw.githack.com/goatfury/gib/417704099b33d462f59139c695e3885de19b1641/previews/atlas-recall-verified/index.html
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const url = process.env.TARGET_URL;
          fs.mkdirSync('public-qa', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = { url, checkedAt: new Date().toISOString(), checks: [] };

          async function openPage(viewport = { width: 1366, height: 768 }, mobile = false) {
            const context = await browser.newContext({ viewport, isMobile: mobile });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => window.__atlasIntegratedReady === true, null, { timeout: 90000 });
            await page.locator('#answerInput').waitFor({ state: 'visible', timeout: 30000 });
            return { context, page, errors };
          }

          try {
            // Initial rendered state.
            {
              const { context, page, errors } = await openPage();
              assert.equal((await page.locator('#zoomReadout').innerText()).trim(), '100%');
              assert.match((await page.locator('#oddHintBtn').innerText()).trim(), /^Hint/);
              assert.equal(await page.locator('#capitalPanel').isVisible(), false);
              await page.screenshot({ path: 'public-qa/01-initial.png', fullPage: true });
              assert.deepEqual(errors, []);
              results.checks.push('public page renders at 100% world view with one field and visible Hint button');
              await context.close();
            }

            // Country -> capital prompt -> first letter -> second letter -> next country.
            {
              const { context, page, errors } = await openPage();
              const input = page.locator('#answerInput');
              await input.fill('Canada');
              await page.waitForFunction(() => document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'), null, { timeout: 10000 });
              assert.match(await input.getAttribute('placeholder'), /Canada/);
              await page.locator('#oddHintBtn').click();
              await page.waitForFunction(() => document.querySelector('.learning-hint-badge')?.textContent.startsWith('Capital: O'));
              assert.match((await page.locator('#oddHintBtn').innerText()).trim(), /2nd letter/);
              await page.locator('#oddHintBtn').click();
              await page.waitForFunction(() => document.querySelector('.learning-hint-badge')?.textContent.startsWith('Capital: Ot'));
              await page.screenshot({ path: 'public-qa/02-second-letter-hint.png', fullPage: true });
              await input.fill('France');
              await page.waitForFunction(() => document.querySelector('#scoreStat')?.textContent.trim().startsWith('2 /'), null, { timeout: 10000 });
              assert.match(await input.getAttribute('placeholder'), /France/);
              assert.match(await page.locator('#feedback').innerText(), /Ottawa/);
              await page.screenshot({ path: 'public-qa/03-next-country.png', fullPage: true });
              assert.deepEqual(errors, []);
              results.checks.push('Canada prompts Ottawa; Hint reveals O then Ot; entering France reveals skipped Ottawa and continues');
              await context.close();
            }

            // Fuzzy capital spelling requires Enter, then teaches canonical spelling.
            {
              const { context, page, errors } = await openPage();
              const input = page.locator('#answerInput');
              await input.fill('South Africa');
              await page.waitForFunction(() => document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'), null, { timeout: 10000 });
              await input.fill('Pretora');
              await page.waitForFunction(() => document.querySelector('#matchCue')?.textContent.includes('press Enter'), null, { timeout: 10000 });
              assert.match((await page.locator('#remainingStat').innerText()).trim(), /^0 \/ 197/);
              await input.press('Enter');
              await page.waitForFunction(() => document.querySelector('#feedback')?.textContent.includes('Pretoria') && document.querySelector('#feedback')?.textContent.includes('Pretora'));
              assert.match((await page.locator('#remainingStat').innerText()).trim(), /^1 \/ 197/);
              await page.screenshot({ path: 'public-qa/04-spelling-correction.png', fullPage: true });
              assert.deepEqual(errors, []);
              results.checks.push('Pretora does not auto-count; Enter accepts the close spelling and visibly teaches Pretoria');
              await context.close();
            }

            // End-of-round answer key.
            {
              const { context, page, errors } = await openPage();
              await page.locator('#answerInput').fill('Canada');
              await page.waitForFunction(() => document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'), null, { timeout: 10000 });
              await page.locator('#giveUpBtn').click();
              await page.locator('#confirmOkay').click();
              await page.waitForFunction(() => document.querySelector('#reviewDialog')?.hasAttribute('open'), null, { timeout: 10000 });
              assert.equal((await page.locator('#reviewTitle').innerText()).trim(), 'Complete answer key');
              assert.equal(await page.locator('.answer-key-card').count(), 197);
              assert.match(await page.locator('.answer-key-card', { hasText: 'Canada' }).first().innerText(), /Ottawa/);
              await page.screenshot({ path: 'public-qa/05-complete-answer-key.png', fullPage: true });
              assert.deepEqual(errors, []);
              results.checks.push('Finish round automatically opens all 197 country-capital answers');
              await context.close();
            }

            // Mobile sanity.
            {
              const { context, page, errors } = await openPage({ width: 390, height: 844 }, true);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              assert.ok(overflow <= 1, `horizontal overflow: ${overflow}px`);
              assert.match((await page.locator('#oddHintBtn').innerText()).trim(), /^Hint/);
              await page.screenshot({ path: 'public-qa/06-mobile.png', fullPage: true });
              assert.deepEqual(errors, []);
              results.checks.push('390px mobile view has no horizontal overflow and retains the Hint control');
              await context.close();
            }

            results.status = 'passed';
            fs.writeFileSync('public-qa/results.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results, null, 2));
          } catch (error) {
            results.status = 'failed';
            results.error = error.stack || String(error);
            fs.writeFileSync('public-qa/results.json', JSON.stringify(results, null, 2));
            throw error;
          } finally {
            await browser.close();
          }
          EOF
          node qa.mjs

      - name: Upload public QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-public-qa
          path: public-qa
          if-no-files-found: error
