name: Oil Atlas Preview QA

on:
  pull_request:
    branches: [main]
    paths:
      - "oil-atlas/**"
      - "netlify.toml"
      - ".github/workflows/oil-atlas-preview-qa.yml"

permissions:
  contents: read

env:
  PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--gib-live.netlify.app

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and validate oil plus ship-flow layers
        run: |
          node oil-atlas/build-audited.mjs
          test -s oil-atlas/public/index.html
          test -s oil-atlas/public/data/fallback.json
          test -s oil-atlas/public/smooth-oil.css
          test -s oil-atlas/public/smooth-oil.js
          test -s oil-atlas/public/ship-traffic.css
          test -s oil-atlas/public/ship-traffic.js
          grep -q 'src="/smooth-oil.js"' oil-atlas/public/index.html
          grep -q 'href="/smooth-oil.css"' oil-atlas/public/index.html
          grep -q 'src="/ship-traffic.js"' oil-atlas/public/index.html
          grep -q 'href="/ship-traffic.css"' oil-atlas/public/index.html
          grep -q "51 â†’ 18 â†’ 4 â†’ 0" oil-atlas/public/ship-traffic.js
          grep -q "EASTâ€“WEST â†’ YANBU" oil-atlas/public/smooth-oil.js
          grep -q "HABSHANâ€“FUJAIRAH" oil-atlas/public/smooth-oil.js
          node --test oil-atlas/tests/gulf-model.test.mjs
          node --test oil-atlas/tests/traffic-model.test.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('oil-atlas/public/data/fallback.json', 'utf8'));
          if (data.schemaVersion !== 2) throw new Error('Unexpected audited schemaVersion');
          if (!Array.isArray(data.gulf?.periods) || data.gulf.periods.length !== 5) throw new Error('Audited Gulf periods missing');
          if (!Array.isArray(data.gulf?.observations) || data.gulf.observations.length < 4) throw new Error('Audited observations missing');
          if (!Array.isArray(data.gulf?.hormuzQuarters) || data.gulf.hormuzQuarters.length !== 6) throw new Error('Hormuz quarters missing');
          if ('anchors' in data.gulf) throw new Error('Legacy fake daily anchors survived');
          const smooth = readFileSync('oil-atlas/public/smooth-oil.js', 'utf8');
          for (const marker of ["['2025-09-01',24.1", "['2026-02-15',25.6", "['2026-03-04',12.5", "['2026-03-15',8.6"]) {
            if (!smooth.includes(marker)) throw new Error(`Smooth model marker missing: ${marker}`);
          }
          NODE

      - name: Wait for the ship-traffic Netlify preview
        run: |
          for attempt in $(seq 1 72); do
            if curl --fail --silent --show-error --location "$PREVIEW_URL/" -o /tmp/oil-atlas.html; then
              if grep -q 'src="/ship-traffic.js"' /tmp/oil-atlas.html && grep -q 'src="/smooth-oil.js"' /tmp/oil-atlas.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Ship-traffic Netlify preview did not become reachable" >&2
          exit 1

      - name: Verify live oil and daily traffic endpoints
        run: |
          curl --fail --silent --show-error --location "$PREVIEW_URL/api/oil_data" -o /tmp/oil-data.json
          curl --fail --silent --show-error --location "$PREVIEW_URL/api/hormuz_traffic" -o /tmp/hormuz-traffic.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('/tmp/oil-data.json', 'utf8'));
          if (data.schemaVersion !== 2) throw new Error('Unexpected live oil schemaVersion');
          if (!data.checkedAt) throw new Error('Missing oil checkedAt');
          if (!Array.isArray(data.world?.anchors) || data.world.anchors.length < 12) throw new Error('World anchors missing');
          if (!Array.isArray(data.world?.regions) || data.world.regions.length !== 8) throw new Error('World regions missing');
          if (!Array.isArray(data.gulf?.periods) || data.gulf.periods.length !== 5) throw new Error('Gulf periods missing');
          if ('anchors' in data.gulf) throw new Error('Legacy Gulf daily anchors survived');

          const traffic = JSON.parse(readFileSync('/tmp/hormuz-traffic.json', 'utf8'));
          if (traffic.schemaVersion !== 1) throw new Error('Unexpected traffic schemaVersion');
          if (traffic.preCrisisPortWatchMedian !== 73) throw new Error('PortWatch baseline changed');
          if (!Array.isArray(traffic.records) || traffic.records.length < 300) throw new Error('Daily traffic series missing');
          const byDate = new Map(traffic.records.map((row) => [row.date, row]));
          const cliff = ['2026-02-28','2026-03-01','2026-03-02','2026-03-04'].map((date) => byDate.get(date)?.total);
          if (JSON.stringify(cliff) !== JSON.stringify([51,18,4,0])) throw new Error(`Traffic cliff changed: ${JSON.stringify(cliff)}`);
          for (const row of traffic.records) {
            if (row.tanker + row.cargo !== row.total) throw new Error(`Traffic category mismatch on ${row.date}`);
          }
          console.log(JSON.stringify({ oilCheckedAt: data.checkedAt, trafficCheckedAt: traffic.checkedAt, latestTrafficDate: traffic.latestPublishedDate, trafficCliff: cliff }, null, 2));
          NODE

      - name: Real-browser artery-to-trickle QA and screenshots
        run: |
          mkdir -p /tmp/oil-atlas-shots
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/oil-atlas-chrome about:blank \
            >/tmp/oil-atlas-chrome.log 2>&1 &
          echo $! >/tmp/oil-atlas-chrome.pid

          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          mkdirSync('/tmp/oil-atlas-shots', { recursive: true });

          let page;
          for (let i = 0; i < 60; i += 1) {
            try {
              const tabs = await (await fetch('http://127.0.0.1:9222/json/list')).json();
              page = tabs.find((tab) => tab.type === 'page');
              if (page?.webSocketDebuggerUrl) break;
            } catch {}
            await sleep(250);
          }
          if (!page?.webSocketDebuggerUrl) throw new Error('Chrome DevTools endpoint unavailable');

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let nextId = 0;
          const pending = new Map();
          ws.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
            else waiter.resolve(message.result);
          });
