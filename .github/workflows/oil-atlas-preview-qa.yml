name: Oil Atlas Preview QA

on:
  pull_request:
    branches: [main]
    paths:
      - "oil-atlas/**"
      - "netlify.toml"
      - ".github/workflows/oil-atlas-preview-qa.yml"

permissions:
  contents: read

env:
  PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--gib-live.netlify.app

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test
        run: |
          node oil-atlas/build-audited.mjs
          test -s oil-atlas/public/index.html
          test -s oil-atlas/public/ship-traffic.css
          test -s oil-atlas/public/ship-traffic.js
          grep -q "51 → 18 → 4 → 0" oil-atlas/public/ship-traffic.js
          node --test oil-atlas/tests/gulf-model.test.mjs oil-atlas/tests/smooth-flow.test.mjs oil-atlas/tests/traffic-model.test.mjs

      - name: Wait for Netlify preview
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location "$PREVIEW_URL/" -o /tmp/page.html && grep -q "ship-traffic.js" /tmp/page.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify live endpoints
        run: |
          curl --fail --silent --location "$PREVIEW_URL/api/oil_data" -o /tmp/oil.json
          curl --fail --silent --location "$PREVIEW_URL/api/hormuz_traffic" -o /tmp/traffic.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const oil = JSON.parse(readFileSync('/tmp/oil.json', 'utf8'));
          const traffic = JSON.parse(readFileSync('/tmp/traffic.json', 'utf8'));
          if (oil.schemaVersion !== 2) throw new Error('Oil schema failed');
          if (!Array.isArray(traffic.records) || traffic.records.length < 120) throw new Error('Traffic series failed');
          if (traffic.preCrisisPortWatchMedian !== 73) throw new Error('Traffic baseline failed');
          const byDate = Object.fromEntries(traffic.records.map((row) => [row.date, row.total]));
          if (byDate['2026-02-28'] !== 51 || byDate['2026-03-01'] !== 18 || byDate['2026-03-02'] !== 4 || byDate['2026-03-04'] !== 0) throw new Error('Traffic cliff failed');
          console.log({ trafficThrough: traffic.latestPublishedDate, baseline: traffic.preCrisisPortWatchMedian });
          NODE

      - name: Browser smoke test
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=1366,768 --virtual-time-budget=8000 \
            --dump-dom "$PREVIEW_URL/?qaDate=2026-03-02&qaPause=1" > /tmp/dom.html
          grep -q 'id="trafficLayer"' /tmp/dom.html
          grep -q 'data-traffic-total="4"' /tmp/dom.html
          grep -Eq 'data-visible-ships="(1|2)"' /tmp/dom.html
          grep -q 'TRAFFIC COLLAPSE' /tmp/dom.html
          grep -q 'Daily tracked ships' /tmp/dom.html
          grep -q 'PortWatch' /tmp/dom.html

      - name: Capture review screenshots
        run: |
          mkdir -p /tmp/review
          timeout 55s google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1366,768 --virtual-time-budget=8000 \
            --screenshot=/tmp/review/prewar-1366.png "$PREVIEW_URL/?qaDate=2026-02-18&qaPause=1"
          timeout 55s google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1366,768 --virtual-time-budget=8000 \
            --screenshot=/tmp/review/collapse-1366.png "$PREVIEW_URL/?qaDate=2026-03-02&qaPause=1"
          timeout 55s google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1024,600 --virtual-time-budget=8000 \
            --screenshot=/tmp/review/collapse-1024.png "$PREVIEW_URL/?qaDate=2026-03-02&qaPause=1"

      - uses: actions/upload-artifact@v4
        with:
          name: oil-atlas-ship-traffic-review
          path: /tmp/review/*.png
          if-no-files-found: error
          retention-days: 7
