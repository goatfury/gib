name: Oil Atlas Preview QA

on:
  pull_request:
    branches: [main]
    paths:
      - "oil-atlas/**"
      - "netlify.toml"
      - ".github/workflows/oil-atlas-preview-qa.yml"

permissions:
  contents: read

env:
  PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--gib-live.netlify.app

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify bundle
        run: |
          node oil-atlas/build.mjs
          test -s oil-atlas/public/index.html
          grep -q "Oil Flow Atlas" oil-atlas/public/index.html
          test -s oil-atlas/public/data/fallback.json

      - name: Wait for Netlify preview
        run: |
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location "$PREVIEW_URL/" -o /tmp/oil-atlas.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Netlify preview did not become reachable" >&2
          exit 1

      - name: Verify page and live data endpoint
        run: |
          grep -q "Oil Flow Atlas" /tmp/oil-atlas.html
          grep -q "Whole world" /tmp/oil-atlas.html
          grep -q "Gulf exports" /tmp/oil-atlas.html
          curl --fail --silent --show-error --location "$PREVIEW_URL/api/oil_data" -o /tmp/oil-data.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('/tmp/oil-data.json', 'utf8'));
          if (data.schemaVersion !== 1) throw new Error('Unexpected schemaVersion');
          if (!data.checkedAt) throw new Error('Missing checkedAt');
          if (!Array.isArray(data.world?.anchors) || data.world.anchors.length < 12) throw new Error('World anchors missing');
          if (!Array.isArray(data.world?.regions) || data.world.regions.length !== 8) throw new Error('World regions missing');
          if (!Array.isArray(data.gulf?.anchors) || !data.gulf?.verifiedThrough) throw new Error('Gulf verification boundary missing');
          if (!['live', 'fallback'].includes(data.refresh?.world)) throw new Error('Refresh state missing');
          console.log(JSON.stringify({
            checkedAt: data.checkedAt,
            refresh: data.refresh.world,
            release: data.world.releaseLabel,
            historicalThrough: data.world.lastHistoricalMonth,
            forecastFrom: data.world.firstForecastMonth,
            gulfVerifiedThrough: data.gulf.verifiedThrough,
          }, null, 2));
          NODE

      - name: Browser render smoke test
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=1366,768 --virtual-time-budget=8000 \
            --dump-dom "$PREVIEW_URL/" > /tmp/oil-atlas-dom.html
          grep -q "Oil Flow Atlas" /tmp/oil-atlas-dom.html
          grep -q "Pause" /tmp/oil-atlas-dom.html
          grep -q "Latest verified" /tmp/oil-atlas-dom.html
