name: Oil Atlas Preview QA

on:
  pull_request:
    branches: [main]
    paths:
      - "oil-atlas/**"
      - "netlify.toml"
      - ".github/workflows/oil-atlas-preview-qa.yml"

permissions:
  contents: read

env:
  PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--gib-live.netlify.app

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and audit Gulf model
        run: |
          node oil-atlas/build-audited.mjs
          test -s oil-atlas/public/index.html
          test -s oil-atlas/public/data/fallback.json
          grep -q "Audited Gulf export evidence" oil-atlas/public/index.html
          grep -q "no daily interpolation" oil-atlas/public/index.html
          node --test oil-atlas/tests/gulf-model.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: oil-atlas-audited-source
          path: |
            oil-atlas/public/index.html
            oil-atlas/public/data/fallback.json
            oil-atlas/lib/*.mjs
            oil-atlas/netlify/functions/*.mjs
            oil-atlas/tests/*.mjs
          if-no-files-found: error

      - name: Wait for audited Netlify preview
        run: |
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location "$PREVIEW_URL/" -o /tmp/oil-atlas.html; then
              if grep -q "Gulf oil evidence" /tmp/oil-atlas.html && grep -q "Audited Gulf export evidence" /tmp/oil-atlas.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Audited Netlify preview did not become reachable" >&2
          exit 1

      - name: Verify page and live data endpoint
        run: |
          grep -q "Gulf oil evidence" /tmp/oil-atlas.html
          grep -q "Whole world" /tmp/oil-atlas.html
          grep -q "Audited Gulf export evidence" /tmp/oil-atlas.html
          curl --fail --silent --show-error --location "$PREVIEW_URL/api/oil_data" -o /tmp/oil-data.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('/tmp/oil-data.json', 'utf8'));
          if (data.schemaVersion !== 2) throw new Error('Unexpected schemaVersion');
          if (!data.checkedAt) throw new Error('Missing checkedAt');
          if (!Array.isArray(data.world?.anchors) || data.world.anchors.length < 12) throw new Error('World anchors missing');
          if (!Array.isArray(data.world?.regions) || data.world.regions.length !== 8) throw new Error('World regions missing');
          if (!Array.isArray(data.gulf?.periods) || data.gulf.periods.length !== 5) throw new Error('Audited Gulf periods missing');
          if (!Array.isArray(data.gulf?.observations) || data.gulf.observations.length !== 4) throw new Error('Gulf observations missing');
          if (!Array.isArray(data.gulf?.hormuzQuarters) || data.gulf.hormuzQuarters.length !== 6) throw new Error('Hormuz quarters missing');
          if ('anchors' in data.gulf) throw new Error('Legacy fake daily anchors survived');
          if (!/No daily interpolation/i.test(data.gulf.policy || '')) throw new Error('Gulf evidence policy missing');
          const periods = Object.fromEntries(data.gulf.periods.map((item) => [item.id, item]));
          if (periods['prewar-iea-average']?.value !== 24) throw new Error('Prewar average changed');
          if (periods['march-tracker-week']?.low !== 7.5 || periods['march-tracker-week']?.high !== 9.71) throw new Error('March tracker range changed');
          if (periods['june-average']?.value !== 16.1 || periods['july-average']?.value !== 15) throw new Error('Monthly evidence changed');
          if (!['live', 'fallback'].includes(data.refresh?.world)) throw new Error('World refresh state missing');
          if (!['live', 'fallback'].includes(data.refresh?.hormuz)) throw new Error('Hormuz refresh state missing');
          console.log(JSON.stringify({
            checkedAt: data.checkedAt,
            worldRefresh: data.refresh.world,
            hormuzRefresh: data.refresh.hormuz,
            release: data.world.releaseLabel,
            broadGulfThrough: data.gulf.latestBroadPeriodEnd,
            policy: data.gulf.policy,
          }, null, 2));
          NODE

      - name: Browser render smoke test
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=1366,768 --virtual-time-budget=8000 \
            --dump-dom "$PREVIEW_URL/" > /tmp/oil-atlas-dom.html
          grep -q "Gulf oil evidence" /tmp/oil-atlas-dom.html
          grep -q "Pause" /tmp/oil-atlas-dom.html
          grep -q "Checked today" /tmp/oil-atlas-dom.html
          grep -q 'class="gulf-period' /tmp/oil-atlas-dom.html
          grep -q 'class="hormuz-quarter-line' /tmp/oil-atlas-dom.html
          grep -q "UNKNOWN" /tmp/oil-atlas-dom.html
