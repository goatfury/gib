name: Temporary publish refined preview link

on:
  pull_request:
    branches:
      - oil-flow-atlas

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Publish stable redirect when the verified preview exists
        shell: bash
        run: |
          set -euo pipefail
          [ -s PREVIEW_RELEASE.json ] || exit 0
          preview_url="$(python3 -c 'import json;print(json.load(open("PREVIEW_RELEASE.json"))["immutable_url"])')"
          cat > PREVIEW_REDIRECT.html <<EOF
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=$preview_url"><title>Oil Atlas refined-products preview</title></head><body><p><a href="$preview_url">Open the verified Oil Atlas refined-products preview</a></p></body></html>
          EOF
          git config user.name goatfury
          git config user.email goatfury@gmail.com
          git add PREVIEW_REDIRECT.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish stable refined-products preview link'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
