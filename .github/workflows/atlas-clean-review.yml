name: Atlas clean review
on:
  push:
    branches: [atlas-recall-v2-review]
    paths:
      - '.github/workflows/atlas-clean-review.yml'
      - 'previews/atlas-recall-v2/clean/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Recover original source and inspect deployment
        env:
          HAS_NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        run: |
          mkdir -p atlas-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          const root = 'previews/atlas-recall-v2/';
          const parts = ['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05a.b64','part-05b.b64','part-05c.b64','part-06.b64'];
          const source = zlib.gunzipSync(Buffer.from(parts.map(p=>fs.readFileSync(root+p,'utf8')).join(''),'base64')).toString();
          fs.writeFileSync('atlas-evidence/original.html', source);
          console.log('ORIGINAL_BYTES', source.length, 'TOKEN_AVAILABLE', process.env.HAS_NETLIFY_TOKEN);
          const lines=source.split('\n');
          console.log('DATA_DECLARATIONS', lines.filter(l=>/^(const|let) [A-Z_]+\s*=/.test(l)).map(l=>l.slice(0,400)).join('\n'));
          console.log('MAP_SAMPLE', source.match(/<svg[\s\S]{0,2400}/)?.[0]);
          console.log('RELATED_FILES',fs.readdirSync(root).join(', '));
          try { const response=await fetch('https://atlas-recall-v2-review-019fb86e.netlify.app/'); console.log('PUBLIC_HTTP',response.status); const html=await response.text(); console.log('PUBLIC_HEAD',html.slice(0,2000)); fs.writeFileSync('atlas-evidence/public-before.html',html); } catch(e) { console.log('PUBLIC_ERROR',String(e)); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-source-evidence
          path: atlas-evidence
          retention-days: 7
