name: M1 kiosk visual QA

on:
  push:
    branches:
      - agent/m1-kiosk-branding
    paths:
      - .github/workflows/m1-kiosk-visual-qa.yml

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REV_BEFORE_URL: https://gib-live.netlify.app/m1/
      REV_AFTER_URL: https://deploy-preview-72--gib-live.netlify.app/m1/
      RICHMOND_BEFORE_URL: https://gib-richmond-live.netlify.app/m1/
      RICHMOND_AFTER_URL: https://deploy-preview-73--gib-live.netlify.app/m1/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locate Chrome and install the browser driver
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.17.0
      - name: Instrument the real-user sign-in check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/m1-kiosk-visual-qa.mjs')
          source = path.read_text(encoding='utf-8')
          old = (
              "  await page.click('#btnSignIn');\n"
              "  await page.waitForSelector('#signInModal.show', { visible: true, timeout: 10_000 });\n"
              "  await assertSuggestionsClosed(page);\n\n"
              "  const after = await page.evaluate(browserKeys => ({\n"
          )
          new = (
              "  const signInDialogs = [];\n"
              "  const onSignInDialog = async dialog => {\n"
              "    signInDialogs.push(dialog.message());\n"
              "    await dialog.dismiss();\n"
              "  };\n"
              "  page.on('dialog', onSignInDialog);\n"
              "  const signInPreflight = await page.evaluate(browserKeys => ({\n"
              "    name: document.getElementById('nameInput').value,\n"
              "    selectedClasses: Array.from(document.querySelectorAll('#classListWrap input[type=\\\"checkbox\\\"]:checked')).map(input => input.value),\n"
              "    signins: JSON.parse(localStorage.getItem(browserKeys.signins) || '[]').length,\n"
              "    queue: JSON.parse(localStorage.getItem(browserKeys.queue) || '[]').length\n"
              "  }), keys);\n"
              "  assert.match(signInPreflight.name, /^TEST Marvin/u);\n"
              "  assert.equal(signInPreflight.selectedClasses.length, 1);\n"
              "  await page.click('#btnSignIn');\n"
              "  try {\n"
              "    await page.waitForFunction(() => {\n"
              "      const modal = document.getElementById('signInModal');\n"
              "      return Boolean(\n"
              "        modal\n"
              "        && modal.classList.contains('show')\n"
              "        && modal.getAttribute('aria-hidden') === 'false'\n"
              "      );\n"
              "    }, { timeout: 10_000 });\n"
              "  } catch (error) {\n"
              "    const failureState = await page.evaluate(browserKeys => {\n"
              "      const modal = document.getElementById('signInModal');\n"
              "      return {\n"
              "        inputName: document.getElementById('nameInput').value,\n"
              "        checkedClasses: Array.from(document.querySelectorAll('#classListWrap input[type=\\\"checkbox\\\"]:checked')).map(input => input.value),\n"
              "        modalClass: modal ? modal.className : 'missing',\n"
              "        modalAriaHidden: modal ? modal.getAttribute('aria-hidden') : 'missing',\n"
              "        signInDisabled: document.getElementById('btnSignIn').disabled,\n"
              "        signins: JSON.parse(localStorage.getItem(browserKeys.signins) || '[]').length,\n"
              "        queue: JSON.parse(localStorage.getItem(browserKeys.queue) || '[]').length\n"
              "      };\n"
              "    }, keys);\n"
              "    await page.screenshot({\n"
              "      path: path.join(OUTPUT_DIR, `sign-in-failure-${installation}.png`),\n"
              "      fullPage: true\n"
              "    });\n"
              "    throw new Error(`Sign-in confirmation did not open. Preflight=${JSON.stringify(signInPreflight)} State=${JSON.stringify(failureState)} Dialogs=${JSON.stringify(signInDialogs)} Cause=${error.message}`);\n"
              "  } finally {\n"
              "    page.off('dialog', onSignInDialog);\n"
              "  }\n"
              "  assert.deepEqual(signInDialogs, []);\n"
              "  await assertSuggestionsClosed(page);\n\n"
              "  const after = await page.evaluate(browserKeys => ({\n"
          )
          if source.count(old) != 1:
              raise SystemExit('sign-in QA anchor drifted')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Wait for all exact public review URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in "$REV_BEFORE_URL" "$REV_AFTER_URL" "$RICHMOND_BEFORE_URL" "$RICHMOND_AFTER_URL"; do
            ready=''
            for attempt in $(seq 1 60); do
              status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = '200' ]; then
                ready='yes'
                break
              fi
              sleep 5
            done
            if [ "$ready" != 'yes' ]; then
              echo "Public review URL unavailable: $url" >&2
              exit 1
            fi
          done
      - name: Exercise instructor and Admin flows at Fire portrait and desktop sizes
        run: node tools/m1-kiosk-visual-qa.mjs
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-kiosk-browser-qa
          path: artifacts/m1-kiosk-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Remove one-shot QA files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-kiosk-visual-qa.yml tools/m1-kiosk-visual-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m1-kiosk-visual-qa.yml tools/m1-kiosk-visual-qa.mjs
          git commit -m 'chore(m1): complete kiosk browser QA'
          git push origin HEAD:agent/m1-kiosk-branding
