name: M1 verified logo import

on:
  push:
    branches:
      - agent/m1-kiosk-branding
    paths:
      - .github/workflows/m1-asset-discovery.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, optimize, and commit official assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p m1/assets /tmp/m1-logos
          curl --fail --location --silent --show-error \
            'https://revolutionbjj.com/wp-content/uploads/2025/05/cropped-RBJJlogo-hi-res-2015.png' \
            --output /tmp/m1-logos/revolution.png
          curl --fail --location --silent --show-error \
            'https://images.squarespace-cdn.com/content/v1/60df68b141b02f78f053e8e6/1625254262073-ON61IBBD9WH8O03Q4HX5/LOGO-RIchmond+BJJ.png?format=1500w' \
            --output /tmp/m1-logos/richmond.png
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image

          assets = [
              {
                  'installationId': 'rev',
                  'input': Path('/tmp/m1-logos/revolution.png'),
                  'output': Path('m1/assets/revolution-bjj-logo.webp'),
                  'source': 'https://revolutionbjj.com/wp-content/uploads/2025/05/cropped-RBJJlogo-hi-res-2015.png',
                  'alt': 'Revolution BJJ logo'
              },
              {
                  'installationId': 'richmond',
                  'input': Path('/tmp/m1-logos/richmond.png'),
                  'output': Path('m1/assets/richmond-bjj-logo.webp'),
                  'source': 'https://images.squarespace-cdn.com/content/v1/60df68b141b02f78f053e8e6/1625254262073-ON61IBBD9WH8O03Q4HX5/LOGO-RIchmond+BJJ.png?format=1500w',
                  'alt': 'Richmond Brazilian Jiu-Jitsu and Self-Defense Academy logo'
              }
          ]
          manifest = []
          for item in assets:
              source_bytes = item['input'].read_bytes()
              with Image.open(item['input']) as image:
                  image.load()
                  original_size = [image.width, image.height]
                  image.thumbnail((720, 360), Image.Resampling.LANCZOS)
                  if image.mode not in ('RGB', 'RGBA'):
                      image = image.convert('RGBA')
                  image.save(item['output'], 'WEBP', quality=88, method=6)
                  output_size = [image.width, image.height]
              output_bytes = item['output'].read_bytes()
              manifest.append({
                  'installationId': item['installationId'],
                  'file': item['output'].as_posix(),
                  'alt': item['alt'],
                  'officialSource': item['source'],
                  'originalDimensions': original_size,
                  'optimizedDimensions': output_size,
                  'sourceSha256': hashlib.sha256(source_bytes).hexdigest(),
                  'assetSha256': hashlib.sha256(output_bytes).hexdigest(),
                  'assetBytes': len(output_bytes)
              })
          Path('m1/assets/logo-sources.json').write_text(
              json.dumps({'verifiedAt': '2026-08-27', 'assets': manifest}, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2))
          PY
          rm .github/workflows/m1-asset-discovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add m1/assets .github/workflows/m1-asset-discovery.yml
          git commit -m 'feat(m1): add verified local gym logos'
          git push origin HEAD:agent/m1-kiosk-branding
