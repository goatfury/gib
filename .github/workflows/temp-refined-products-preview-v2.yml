name: Temporary refined-products preview and QA v2

on:
  pull_request:
    branches:
      - oil-flow-atlas

permissions:
  contents: write
  pull-requests: write

jobs:
  build-deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_SITE_ID: bdcb59e0-d7c1-4173-a5e1-0e19b75c2cff
      PROXY_BASE: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..CQwGDvt8vefF_5--.AozlMlfqlRaGgIOmQCHIxc_35vVUEPItIHyZk-zXWdPFp4kT8IXKBMUtXimTauzo0A4Ulf_aBZX6UgELanlvawebC8dxma2sBDcZdfLAvKVoMkdfpkG-X33JW3kqAuuYN6DnEvOoHcGt440uv81rbAppFoziMsB_l-F73QePi6ovmb5sO081kKcovjGf0ijgFv_BeOCi9G1sCdIWwUEU8ws6pRv-wed3EyWhfwHINWTAwF70yEuKS0AlzCQ0pCDVOs0i9P-aOxgbSHiE2Zcquvg8_yN0WMRZMWjNSbp1kIo8CVLfLywUtMWkbZYJv6XHmyDnb_nXrWFjDrxxPcuJAwbAs50BRqUqMq1xC2kLtWsdmxCDDTMz7SlmQpZ6tdoERa4eY0I5.KtsMnNq3FWtbRHnCKY1IGQ

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate and validate the checked-in JODI snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-refined-products-data.py
          python3 - <<'PY'
          import json
          data=json.load(open('refined-products/refined-products-data.json'))
          assert data['schema']==1
          assert len(data['months'])>=6
          assert data['coverage']['latestCountries']>=20
          latest=data['months'][-1]
          for key in ('output','demand','exports','imports'):
              assert latest['global'][key]>0,(key,latest['global'])
          print(json.dumps({'latestPeriod':data['latestPeriod'],'coverage':data['coverage'],'global':latest['global'],'reportedProduct':data['reportedProduct'],'reportedUnit':data['reportedUnit']},indent=2))
          PY
          if ! git diff --quiet -- refined-products/refined-products-data.json; then
            git config user.name goatfury
            git config user.email goatfury@gmail.com
            git add refined-products/refined-products-data.json
            git commit -m 'Add JODI refined-products snapshot'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Build exact source and run isolated local browser QA
        shell: bash
        run: |
          set -euo pipefail
          node build-audited.mjs
          publish_asset="$(find . -type f -name refined-products.js ! -path './refined-products/*' | head -1)"
          test -n "$publish_asset"
          publish_dir="$(dirname "$publish_asset")"
          test -s "$publish_dir/index.html"
          test -s "$publish_dir/refined-products-data.json"
          echo "PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"

          mkdir -p /tmp/oil-qa
          cd /tmp/oil-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          cd "$GITHUB_WORKSPACE"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          python3 -m http.server 8765 --directory "$publish_dir" >/tmp/oil-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1

          cat > /tmp/oil-qa/qa.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const assert=(ok,msg,detail)=>{if(!ok)throw Error(`${msg}: ${JSON.stringify(detail)}`)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            try{
              const desktop=await browser.newPage();
              await desktop.setViewport({width:1440,height:900,deviceScaleFactor:1});
              desktop.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              desktop.on('pageerror',e=>errors.push(e.message));
              await desktop.goto('http://127.0.0.1:8765/?qa=local',{waitUntil:'networkidle0',timeout:60000});
              await desktop.waitForFunction(()=>window.__OIL_ATLAS_STREAM__?.getState?.().installed,{timeout:20000});
              let result=await desktop.evaluate(()=>({body:document.body.className,crude:document.querySelector('[data-stream=crude]')?.getAttribute('aria-pressed'),refined:document.querySelector('[data-stream=refined]')?.getAttribute('aria-pressed'),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
              assert(result.crude==='true'&&result.refined==='false'&&!result.body.includes('refined-products-active')&&!result.overflow,'Crude baseline changed',result);
              await desktop.click('[data-stream=refined]');
              await desktop.waitForFunction(()=>document.body.classList.contains('refined-products-active')&&document.querySelectorAll('.rp-metric-value').length===4,{timeout:10000});
              result=await desktop.evaluate(()=>({state:window.__OIL_ATLAS_STREAM__.getState(),metrics:[...document.querySelectorAll('.rp-metric-value')].map(x=>x.textContent.trim()),rows:document.querySelectorAll('.rp-trade .rp-row').length,disclosure:document.querySelector('.rp-stream-disclosure')?.textContent,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
              assert(result.state.period&&result.metrics.length===4&&!result.metrics.some(x=>x.startsWith('—'))&&result.rows>=8&&result.disclosure?.includes('JODI')&&!result.overflow,'Refined desktop failed',result);
              await desktop.screenshot({path:'refined-products-desktop.png'});
              await desktop.click('[data-stream=crude]');
              assert(!(await desktop.evaluate(()=>document.body.classList.contains('refined-products-active'))),'Crude restore failed',{});
              await desktop.close();

              const mobile=await browser.newPage();
              await mobile.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true});
              mobile.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              mobile.on('pageerror',e=>errors.push(e.message));
              await mobile.goto('http://127.0.0.1:8765/?stream=refined&qa=mobile',{waitUntil:'networkidle0',timeout:60000});
              await mobile.waitForFunction(()=>document.body.classList.contains('refined-products-active')&&document.querySelectorAll('.rp-metric-value').length===4,{timeout:20000});
              result=await mobile.evaluate(()=>({overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),toggle:document.querySelector('#oilStreamToggle')?.getBoundingClientRect().toJSON(),metrics:document.querySelector('.rp-metrics')?.getBoundingClientRect().toJSON()}));
              assert(!result.overflow&&result.toggle&&result.toggle.right<=390.5&&result.metrics.right<=390.5,'Refined mobile failed',result);
              await mobile.screenshot({path:'refined-products-mobile.png',fullPage:true});
              await mobile.close();
              assert(!errors.length,'Console or page errors',errors);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH=/tmp/oil-qa/node_modules node /tmp/oil-qa/qa.cjs

      - name: Deploy exact committed source to the dedicated preview site
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -o /tmp/oil-atlas-source.zip HEAD
          response="$(curl -fsS -X POST -F "zip=@/tmp/oil-atlas-source.zip;type=application/zip" "$PROXY_BASE/api/v1/sites/$PREVIEW_SITE_ID/builds")"
          printf '%s\n' "$response" > /tmp/deploy.json
          deploy_id="$(python3 -c 'import json;d=json.load(open("/tmp/deploy.json"));d=d[0] if isinstance(d,list) else d;print(d.get("deploy_id") or d.get("id") or "")')"
          test -n "$deploy_id"
          for attempt in $(seq 1 100); do
            curl -fsS "$PROXY_BASE/api/v1/deploys/$deploy_id" -o /tmp/status.json
            state="$(python3 -c 'import json;print(json.load(open("/tmp/status.json")).get("state",""))')"
            echo "state=$state"
            [ "$state" = ready ] && break
            [ "$state" = error ] && { cat /tmp/status.json; exit 1; }
            sleep 5
          done
          test "$(python3 -c 'import json;print(json.load(open("/tmp/status.json")).get("state",""))')" = ready
          preview_url="$(python3 -c 'import json;d=json.load(open("/tmp/status.json"));print(d.get("deploy_ssl_url") or d.get("ssl_url") or d.get("url") or "")')"
          site_url="$(python3 -c 'import json;d=json.load(open("/tmp/status.json"));print(d.get("ssl_url") or d.get("url") or "")')"
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "PREVIEW_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          printf '%s\n' "$preview_url" > PREVIEW_URL.txt
          printf '{"deploy_id":"%s","immutable_url":"%s","site_url":"%s","source_commit":"%s"}\n' "$deploy_id" "$preview_url" "$site_url" "$(git rev-parse HEAD)" > PREVIEW_RELEASE.json

      - name: Browser-QA the actual deployed artifact and record it
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/oil-qa/deployed.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const assert=(ok,msg,detail)=>{if(!ok)throw Error(`${msg}: ${JSON.stringify(detail)}`)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            try{
              for(const viewport of [{width:1440,height:900},{width:390,height:844,isMobile:true}]){
                const page=await browser.newPage();
                await page.setViewport({...viewport,deviceScaleFactor:1});
                page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto(`${process.env.PREVIEW_URL}/?stream=refined&deployedQa=${Date.now()}`,{waitUntil:'networkidle0',timeout:90000});
                await page.waitForFunction(()=>window.__OIL_ATLAS_STREAM__?.getState?.().installed&&document.body.classList.contains('refined-products-active'),{timeout:30000});
                const result=await page.evaluate(()=>({period:window.__OIL_ATLAS_STREAM__.getState().period,metrics:[...document.querySelectorAll('.rp-metric-value')].map(x=>x.textContent.trim()),rows:document.querySelectorAll('.rp-trade .rp-row').length,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),crude:document.querySelector('[data-stream=crude]')?.getAttribute('aria-pressed'),refined:document.querySelector('[data-stream=refined]')?.getAttribute('aria-pressed')}));
                assert(result.period&&result.metrics.length===4&&!result.metrics.some(x=>x.startsWith('—'))&&result.rows>=8&&!result.overflow&&result.crude==='false'&&result.refined==='true','Deployed QA failed',{viewport,result});
                await page.screenshot({path:`deployed-${viewport.width}.png`,fullPage:viewport.width<500});
                await page.close();
              }
              assert(!errors.length,'Deployed console or page errors',errors);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH=/tmp/oil-qa/node_modules node /tmp/oil-qa/deployed.cjs
          git config user.name goatfury
          git config user.email goatfury@gmail.com
          git add PREVIEW_URL.txt PREVIEW_RELEASE.json
          git commit -m 'Record verified refined-products preview' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-products-preview-qa-v2
          path: |
            refined-products-desktop.png
            refined-products-mobile.png
            deployed-*.png
            PREVIEW_URL.txt
            PREVIEW_RELEASE.json
          if-no-files-found: warn
          retention-days: 2
