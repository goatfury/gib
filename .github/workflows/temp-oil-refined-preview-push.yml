name: Temporary Oil Atlas preview push gate

on:
  push:
    branches:
      - temp-oil-refined-toggle-2026-09-01

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_ID: bdcb59e0-d7c1-4173-a5e1-0e19b75c2cff
      SITE_URL: https://oil-flow-atlas-refined-preview.netlify.app
      HTML_SHA: c150283f391ea3d9ec2899da1e114de2c3a3e9d80b99a19badaac49329b338b7
      PROXY_BASE: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..QyX5atxKa7lhN9Oi.bK_pLuEC_kFIzGDv09KN8ZrmWIj31YCsoUb0r4ya8gO9KrBmXQdk68n8wqUJK7rlsXfQ5iPOCBW9aoQvttKl-Y0WvonsFK3W-2gMakOIqR2QjrqjpKfGTnr9scamu9gt29fqMXkTT-ezDAC6Y-9Ityh2nyQMn6gAmweZgXreSArJep8LxWqR4u2yqJAWePKWUNrGotFo0eTEtixPP3wktDYExjs47lRrN-bvAIXPi96GEciocZ-M95_ZOjsDaTgmBFPP3j_zq3ZuxktiRXfoTTZQNc8zQ3NhJHVG_K8DWyISTXs1LJSaPJwYgrsfXoHlHw_utgyxl0NMvL177OKO8t-W3F5PuZiPg_kPM4R5xEOPK1N2Ei9TeKIYPtJbfS4IaVWoeXuM.VqOkmHQYxTu_ZaGtbeRODw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run check
          echo "$HTML_SHA  public/index.html" | sha256sum -c -
          git merge-base --is-ancestor 906d4a30ea41ae27a7c27b9eaadd38b1f0ba4fc4 HEAD
      - name: Deploy review build with its serverless functions
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r /tmp/source.zip . \
            -x '.git/*' 'node_modules/*' '.github/*' 'qa/*' '.netlify/*' '*.zip'
          curl -fsS -X POST -F "zip=@/tmp/source.zip;type=application/zip" "$PROXY_BASE/api/v1/sites/$SITE_ID/builds" -o /tmp/deploy.json
          deploy_id="$(python3 -c 'import json; d=json.load(open("/tmp/deploy.json")); d=d[0] if isinstance(d,list) else d; print(d.get("deploy_id") or d.get("id") or "")')"
          test -n "$deploy_id"
          for n in $(seq 1 72); do
            curl -fsS "$PROXY_BASE/api/v1/deploys/$deploy_id" -o /tmp/status.json
            state="$(python3 -c 'import json; print(json.load(open("/tmp/status.json")).get("state", ""))')"
            echo "state=$state"
            [ "$state" = ready ] && break
            [ "$state" = error ] && { cat /tmp/status.json; exit 1; }
            sleep 5
          done
          test "$(python3 -c 'import json; print(json.load(open("/tmp/status.json")).get("state", ""))')" = ready
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "IMMUTABLE_URL=$(python3 -c 'import json; print(json.load(open("/tmp/status.json")).get("deploy_ssl_url", ""))')" >> "$GITHUB_ENV"
      - name: Browser QA live preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/?id=$RANDOM" -o /tmp/live.html
          echo "$HTML_SHA  /tmp/live.html" | sha256sum -c -
          for endpoint in /api/oil_data /api/hormuz_traffic; do
            status="$(curl -sS -o /tmp/api.json -w '%{http_code}' "$SITE_URL$endpoint")"
            test "$status" = 200
          done
          npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          chrome="$(command -v google-chrome || command -v chromium)"
          mkdir -p qa
          cat > qa/run.cjs <<'JS'
          const fs=require('fs'),p=require('puppeteer-core');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const site=process.env.SITE_URL, result={site,deployId:process.env.DEPLOY_ID,immutableUrl:process.env.IMMUTABLE_URL,views:{}};
          function ok(v,m,d){if(!v)throw new Error(m+' '+JSON.stringify(d||{}));}
          async function run(browser,name,vp){
            const page=await browser.newPage(); await page.setViewport(vp); const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)}); page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            page.on('response',r=>{if(r.status()>=400)errors.push(`http:${r.status()}:${r.url()}`)});
            await page.goto(site+'/?qaPause=1&t='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('#refinedStream');
            await page.evaluate(()=>{const i=document.querySelector('#timeline'),s=Date.UTC(2025,8,1),d=Date.UTC(2026,5,1);i.value=Math.round((d-s)/86400000);i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))});
            await sleep(400); await page.click('#refinedStream'); await sleep(350);
            const gulf=await page.evaluate(()=>({v:flowNumber.textContent.trim(),t:phaseTitle.textContent.trim(),c:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),p:document.querySelectorAll('.refined-month-point').length,o:Math.max(0,document.documentElement.scrollWidth-innerWidth),a:refinedStream.getAttribute('aria-pressed')}));
            ok(gulf.v==='1.61'&&/recover only part/i.test(gulf.t)&&/Saudi Arabia, Kuwait and Bahrain/i.test(gulf.c)&&gulf.p===10&&gulf.o===0&&gulf.a==='true','Gulf refined gate',gulf);
            await page.click('[data-mode="world"]'); await sleep(350);
            const world=await page.evaluate(()=>({v:flowNumber.textContent.trim(),t:phaseTitle.textContent.trim(),c:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),n:document.querySelectorAll('.world-node.no-report').length,p:document.querySelectorAll('.refined-month-point').length,o:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
            ok(world.v==='63.31'&&/reported cohort rebounds/i.test(world.t)&&/47 countries/i.test(world.c)&&world.n>=2&&world.p===10&&world.o===0,'World refined gate',world);
            await page.click('#liquidsStream'); await sleep(250);
            const back=await page.evaluate(()=>({r:document.documentElement.classList.contains('refined-products'),a:liquidsStream.getAttribute('aria-pressed'),o:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
            ok(!back.r&&back.a==='true'&&back.o===0&&errors.length===0,'Restore/error gate',{back,errors});
            result.views[name]={gulf,world,back,errors}; if(name==='desktop')await page.screenshot({path:'qa/desktop.png',fullPage:true}); if(name==='mobile')await page.screenshot({path:'qa/mobile.png',fullPage:true}); await page.close();
          }
          (async()=>{const b=await p.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{await run(b,'desktop',{width:1879,height:800});await run(b,'laptop',{width:1440,height:900});await run(b,'mobile',{width:390,height:844});fs.writeFileSync('qa/results.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));}finally{await b.close();}})().catch(e=>{fs.writeFileSync('qa/failure.txt',e.stack);throw e});
          JS
          CHROME_PATH="$chrome" node qa/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oil-refined-preview-qa
          path: qa
          if-no-files-found: warn
          retention-days: 2
