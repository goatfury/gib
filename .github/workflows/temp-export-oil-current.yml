name: Temporary export current Oil Atlas source

on:
  pull_request:
    branches:
      - oil-flow-atlas

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: current-oil-atlas-source
          path: .
          include-hidden-files: true
          retention-days: 1
