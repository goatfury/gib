name: M1 kiosk and branding verification

on:
  push:
    branches:
      - agent/m1-kiosk-branding
    paths:
      - .github/workflows/m1-kiosk-branding-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update the exact offline shell expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/m1-offline-shell.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = (
              "      `${ORIGIN}/m1/staff-clock-client.mjs?v=${harness.revision}`\n"
              "    ]"
          )
          new = (
              "      `${ORIGIN}/m1/staff-clock-client.mjs?v=${harness.revision}`,\n"
              "      `${ORIGIN}/m1/kiosk-enhancements.css?v=${harness.revision}`,\n"
              "      `${ORIGIN}/m1/kiosk-enhancements.mjs?v=${harness.revision}`,\n"
              "      `${ORIGIN}/m1/kiosk-enhancements-core.mjs`,\n"
              "      `${ORIGIN}/m1/assets/revolution-bjj-logo.webp`,\n"
              "      `${ORIGIN}/m1/assets/richmond-bjj-logo.webp`\n"
              "    ]"
          )
          if source.count(old) != 1:
              raise SystemExit('offline shell expectation anchor drifted')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Install
        run: npm ci
      - name: Generate installation profile
        run: npm run build
      - name: Complete M1 test suite
        run: npm test
      - name: Commit verified candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-kiosk-branding-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/m1-offline-shell.test.mjs m1/installation-profile.generated.js netlify/functions/_lib/m1-installation.generated.mjs .github/workflows/m1-kiosk-branding-verify.yml
          git commit -m 'chore(m1): verify kiosk branding candidate'
          git push origin HEAD:agent/m1-kiosk-branding
