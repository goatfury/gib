name: Temporary Oil Atlas feature preview

on:
  pull_request:
    branches: [oil-flow-atlas]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ID: bdcb59e0-d7c1-4173-a5e1-0e19b75c2cff
      SITE_URL: https://oil-flow-atlas-refined-preview.netlify.app
      PROXY_PATH: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..Pat1V7wcDu0IF9ha.lTRml8z7M4JMpeHTmqyAhDXY0gm-EfYLu_2sBhukVtfn7mMRgDxEofPUqHncyekomX2L648irne4IAxSxzEe9YW8OmVrD9qk6V7miB5dki0WCg5X8j6CIdQNYYQ1kJ1TjW6CkRDpqLHVnghp-PbMvz4bPJcZZ3udu6tKPdshd2JJMZfSWeRbj55nxD_6Uu6KQSeb0WU1X-PHsetmncsSU4ilFdd7clJNRKe_SDS0PYdSmMmXMyIV2cBcCwUyzuEK0Qn2_KwQuFi7HQUT5GqSkyZ-hDVurewayl_Lw2Z1gCunUGDzlIrKksitZLq1QX5pSByHvEqD3xnUKRL_M1i6_QcW_zBIzobjjQjXk1BnKnhtgIHBCoVhQ5DGKyTNxJ9PcGcM8Szy.1jFkPNQn3veaI03YWLNqCA

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          npm install --no-audit --no-fund
          node build-audited.mjs | tee qa/build.log
          node --test tests/*.test.mjs | tee qa/tests.log
          node --check public/smooth-oil.js
          node --check public/ship-traffic.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('public/index.html').read_text()
          assert 'realistic-gulf-map' in html
          assert html.count('class="regional-country"') >= 12
          assert 'data-stream="refined"' in html
          assert 'Crude &amp; liquids' in html
          assert Path('public/refined-toggle.css').exists()
          assert Path('public/data/refined-products.json').exists()
          scripts=re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts
          Path('/tmp/oil-inline.js').write_text(scripts[-1])
          PY
          node --check /tmp/oil-inline.js
          sha256sum public/index.html | tee qa/local-index.sha256
          rm -f .generated-apply-refined-map.mjs .apply-refined-toggle.generated.mjs

      - name: Deploy exact source
        shell: bash
        run: |
          set -euo pipefail
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH" | tee qa/deploy.log
          expected="$(awk '{print $1}' qa/local-index.sha256)"
          for n in $(seq 1 60); do
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/?v=$RANDOM-$n" -o qa/live-index.html || true
            actual="$(sha256sum qa/live-index.html 2>/dev/null | awk '{print $1}')"
            echo "expected=$expected actual=$actual"
            [ "$actual" = "$expected" ] && break
            sleep 5
          done
          test "$(sha256sum qa/live-index.html | awk '{print $1}')" = "$expected"

      - name: Browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          cat > /tmp/qa.cjs <<'JS'
          const fs=require('fs'), puppeteer=require('puppeteer-core');
          const site=process.env.SITE_URL, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out={site,desktop:{},mobile:{},errors:[]};
          const ok=(x,m,d)=>{if(!x)throw new Error(`${m} — ${JSON.stringify(d)}`)};
          async function open(browser,width,height){
            const page=await browser.newPage(); await page.setViewport({width,height});
            const errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(`${site}/?qa=${Date.now()}`,{waitUntil:'networkidle0',timeout:60000});
            await page.waitForSelector('#refinedStream',{timeout:20000});
            await page.evaluate(()=>document.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})));
            await sleep(250); return {page,errors};
          }
          async function date(page,iso){
            await page.evaluate(iso=>{const start=Date.parse('2025-09-01T00:00:00Z'),t=document.querySelector('#timeline');
              t.value=String(Math.round((Date.parse(iso+'T00:00:00Z')-start)/86400000));
              t.dispatchEvent(new Event('input',{bubbles:true}));},iso); await sleep(160);
          }
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const d=await open(browser,1440,900),p=d.page; await date(p,'2025-09-01');
              const geography=await p.evaluate(()=>({countries:document.querySelectorAll('#regionalCountries .regional-country').length,
                realistic:gulfMap.classList.contains('realistic-gulf-map'),overflow:document.documentElement.scrollWidth-innerWidth,
                refinedButton:!!document.querySelector('#refinedStream')}));
              ok(geography.realistic&&geography.countries>=12&&geography.overflow<=0&&geography.refinedButton,'Geography/default layout failed',geography);
              await p.click('#refinedStream'); await p.waitForFunction(()=>document.documentElement.classList.contains('refined-products')); await date(p,'2025-09-01');
              const gulf=await p.evaluate(()=>({title:pageTitle.textContent.trim(),number:parseFloat(flowNumber.textContent),
                coverage:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),pressed:refinedStream.getAttribute('aria-pressed'),
                overflow:document.documentElement.scrollWidth-innerWidth}));
              ok(gulf.title==='Refined-product flows'&&Math.abs(gulf.number-3.08)<.06&&gulf.coverage.includes('Saudi Arabia')&&gulf.pressed==='true'&&gulf.overflow<=0,'Refined Gulf failed',gulf);
              await p.screenshot({path:'qa/desktop-refined-gulf.png',fullPage:true});
              await p.click('#worldMode'); await date(p,'2025-09-01');
              const world=await p.evaluate(()=>({title:pageTitle.textContent.trim(),number:parseFloat(flowNumber.textContent),
                coverage:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),overflow:document.documentElement.scrollWidth-innerWidth}));
              ok(world.title==='Refinery output'&&Math.abs(world.number-64.45)<.1&&world.coverage.includes('47 countries')&&world.overflow<=0,'Refined world failed',world);
              await p.screenshot({path:'qa/desktop-refined-world.png',fullPage:true});
              await p.click('#liquidsStream'); await p.click('#gulfMode'); await sleep(150);
              const restored=await p.evaluate(()=>({title:pageTitle.textContent.trim(),refined:document.documentElement.classList.contains('refined-products')}));
              ok(restored.title==='Gulf oil evidence'&&!restored.refined,'Original view failed to restore',restored);
              const before=await p.$eval('#timeline',e=>+e.value); await p.click('#playButton'); await sleep(700);
              const after=await p.$eval('#timeline',e=>+e.value); ok(after>before,'Playback failed',{before,after});
              if(await p.$eval('#playButton',e=>e.getAttribute('aria-pressed'))==='true')await p.click('#playButton');
              ok(!d.errors.length,'Desktop errors',d.errors); out.desktop={geography,gulf,world,restored,playback:{before,after}};
              await p.close();
              const m=await open(browser,390,844),mp=m.page; await mp.click('#refinedStream'); await date(mp,'2026-06-15');
              const mobile=await mp.evaluate(()=>({title:pageTitle.textContent.trim(),number:parseFloat(flowNumber.textContent),
                overflow:document.documentElement.scrollWidth-innerWidth,switchVisible:getComputedStyle(document.querySelector('.stream-switch')).display!=='none'}));
              ok(mobile.title==='Refined-product flows'&&Math.abs(mobile.number-1.608)<.06&&mobile.overflow<=0&&mobile.switchVisible,'Mobile failed',mobile);
              ok(!m.errors.length,'Mobile errors',m.errors); out.mobile=mobile;
              await mp.screenshot({path:'qa/mobile-refined-gulf.png',fullPage:true}); await mp.close();
              fs.writeFileSync('qa/browser-qa.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
            }finally{await browser.close()}
          })().catch(e=>{out.errors.push(e.stack||String(e));fs.writeFileSync('qa/browser-qa.json',JSON.stringify(out,null,2));console.error(e);process.exit(1)});
          JS
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/qa.cjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oil-refined-preview-qa
          path: qa
          retention-days: 3
          if-no-files-found: warn
