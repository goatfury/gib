name: Temporary Oil Atlas clarity preview and QA

on:
  pull_request:
    branches:
      - oil-flow-atlas

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 1064d737960a76b55bdc5a4f8b696af3acfd4ab3
      EXPECTED_HTML_SHA: c3b4e0fb21d625242aad33357be69708fc89b741e339859e34f66cb428b83fd4
      EXPECTED_JS_SHA: f5682132744f5e24ebe0fe4832cb7dc61d82e2c80699215855cf5c8ae8d65a01
      EXPECTED_CSS_SHA: 19604702e51560836802f635c24eb2df05e7c7cbcd0052ef08548379475e4a1b
      SITE_ID: bdcb59e0-d7c1-4173-a5e1-0e19b75c2cff
      SITE_URL: https://oil-flow-atlas-refined-preview.netlify.app
      PROXY_PATH: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..7lgjB71ebRD1dvqI.3_GKDnztq9jokrrTb9Etvy0YE32V00HwqtGQkUCcEAN5yD1ofNn9OEn9x7ebQQfgqcUzD2tHmQ9SCUMqd_lM81Mv3QHH8T4WrKPffxovqkh1jsXCQNkyzzvKntaWUUutZSh6Nlwp_K4fl6WyW4xpc5ueW3db4-BVcWV_JZ865HV7xO9D6Tqd2LQXFH0mpkM3KvPLaO6iUmxTZShpOpjDdvlpL1q0_Qf9D2WUT5V9_euALRWe1f61843VQ1sdCatMm1WTH5jSUjWcZr2QxFTqt8bVrKK4fqPgBmGeNeyVOZiFQUMq9qBmimI4te1qJXNmwxY-WvrBKSVs31Cey8wODQh9CNYbeEUkMdhplKmRMagSX7oHBBppssCqy3df2sQP69oQO96A.3mXC3ORjNs2JjHFCWUNO8w

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Build and verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          npm install --no-audit --no-fund
          node build-audited.mjs | tee qa/build.log
          node --test tests/*.test.mjs | tee qa/tests.log
          node --check public/clarity.js
          echo "$EXPECTED_HTML_SHA  public/index.html" | sha256sum -c -
          echo "$EXPECTED_JS_SHA  public/clarity.js" | sha256sum -c -
          echo "$EXPECTED_CSS_SHA  public/clarity.css" | sha256sum -c -

      - name: Deploy the exact candidate to preview
        shell: bash
        run: |
          set -euo pipefail
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH" | tee qa/deploy.log
          for attempt in $(seq 1 72); do
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/?identity=$RANDOM-$attempt" -o qa/live-index.html || true
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/clarity.js?identity=$RANDOM-$attempt" -o qa/live-clarity.js || true
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/clarity.css?identity=$RANDOM-$attempt" -o qa/live-clarity.css || true
            html="$(sha256sum qa/live-index.html 2>/dev/null | awk '{print $1}')"
            js="$(sha256sum qa/live-clarity.js 2>/dev/null | awk '{print $1}')"
            css="$(sha256sum qa/live-clarity.css 2>/dev/null | awk '{print $1}')"
            echo "attempt=$attempt html=$html js=$js css=$css"
            if [ "$html" = "$EXPECTED_HTML_SHA" ] && [ "$js" = "$EXPECTED_JS_SHA" ] && [ "$css" = "$EXPECTED_CSS_SHA" ]; then break; fi
            sleep 5
          done
          test "$(sha256sum qa/live-index.html | awk '{print $1}')" = "$EXPECTED_HTML_SHA"
          test "$(sha256sum qa/live-clarity.js | awk '{print $1}')" = "$EXPECTED_JS_SHA"
          test "$(sha256sum qa/live-clarity.css | awk '{print $1}')" = "$EXPECTED_CSS_SHA"

      - name: Browser QA the deployed preview
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          cat > /tmp/oil-clarity-qa.cjs <<'JS'
          const fs=require('fs'), puppeteer=require('puppeteer-core');
          const site=process.env.SITE_URL, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out={site,desktop:{},mobile:{},errors:[]};
          const ok=(x,m,d)=>{if(!x)throw new Error(`${m} — ${JSON.stringify(d)}`)};
          async function open(browser,width,height){
            const page=await browser.newPage(); await page.setViewport({width,height});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            page.on('requestfailed',r=>errors.push(`request:${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto(`${site}/?qa=${Date.now()}`,{waitUntil:'networkidle0',timeout:60000});
            await page.waitForSelector('#refinedStream',{timeout:20000});
            await page.evaluate(()=>document.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})));
            await sleep(300); return {page,errors};
          }
          async function setDate(page,iso){
            await page.evaluate(iso=>{const start=Date.parse('2025-09-01T00:00:00Z'),t=document.querySelector('#timeline');
              t.value=String(Math.round((Date.parse(iso+'T00:00:00Z')-start)/86400000));
              t.dispatchEvent(new Event('input',{bubbles:true}));},iso);
            await sleep(220);
          }
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const d=await open(browser,1440,900),p=d.page;
              const defaults=await p.evaluate(()=>({gulf:gulfMode.textContent.trim(),world:worldMode.textContent.trim(),caveatHidden:refinedHeadlineCaveat.classList.contains('hidden')}));
              ok(defaults.gulf==='Gulf routes'&&defaults.world==='Whole world'&&defaults.caveatHidden,'Default labels changed',defaults);

              await p.click('#refinedStream');
              await p.waitForFunction(()=>gulfMode.textContent.trim()==='Gulf reported exports'&&worldMode.textContent.trim()==='Global refinery output'&&!refinedHeadlineCaveat.classList.contains('hidden'));
              await setDate(p,'2026-06-15');
              await p.waitForFunction(()=>phaseTitle.textContent.includes('48% below'));
              const gulf=await p.evaluate(()=>({
                labels:[gulfMode.textContent.trim(),worldMode.textContent.trim()],
                caveat:refinedHeadlineCaveat.textContent.trim(),
                value:parseFloat(flowNumber.textContent),
                title:phaseTitle.textContent.trim(),
                takeaway:phaseText.textContent.trim(),
                mapKey:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),
                reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,
                unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,
                overflow:document.documentElement.scrollWidth-innerWidth,
                gaugeLabel:barrelGauge.getAttribute('aria-label'),
              }));
              ok(gulf.labels[0]==='Gulf reported exports'&&gulf.labels[1]==='Global refinery output','Refined measurement labels failed',gulf);
              ok(gulf.caveat==='Saudi Arabia, Kuwait and Bahrain only — not a Gulf total.','Gulf caveat failed',gulf);
              ok(Math.abs(gulf.value-1.608)<.06&&gulf.title==='Reported exports are 48% below September 2025','Gulf conclusion failed',gulf);
              ok(gulf.takeaway.includes('Kuwait has rebounded from April')&&gulf.reported===3&&gulf.unreported===5,'Gulf map/takeaway failed',gulf);
              ok(gulf.mapKey.includes('hatched = unreported')&&gulf.gaugeLabel.includes('not a Gulf total')&&gulf.overflow<=0,'Gulf clarity/accessibility failed',gulf);
              await p.screenshot({path:'qa/desktop-gulf-clarity.png',fullPage:true});

              await p.click('#worldMode'); await setDate(p,'2026-06-15');
              await p.waitForFunction(()=>phaseTitle.textContent.includes('2% below'));
              const world=await p.evaluate(()=>({
                labels:[gulfMode.textContent.trim(),worldMode.textContent.trim()],
                caveat:refinedHeadlineCaveat.textContent.trim(),
                value:parseFloat(flowNumber.textContent),
                title:phaseTitle.textContent.trim(),
                takeaway:phaseText.textContent.trim(),
                mapKey:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),
                overflow:document.documentElement.scrollWidth-innerWidth,
              }));
              ok(world.caveat==='Fixed 47-country reporting cohort — not a world total.','World caveat failed',world);
              ok(Math.abs(world.value-63.3139)<.06&&world.title==='Reported refinery output is 2% below September 2025','World conclusion failed',world);
              ok(world.takeaway.includes('U.S. is the largest increase')&&world.takeaway.includes('Asia-Pacific is the largest decline'),'World takeaway failed',world);
              ok(world.mapKey.includes('brighter countries report in every month')&&world.overflow<=0,'World clarity failed',world);
              await p.screenshot({path:'qa/desktop-world-clarity.png',fullPage:true});

              await p.click('#liquidsStream'); await p.click('#gulfMode'); await sleep(250);
              const restored=await p.evaluate(()=>({
                labels:[gulfMode.textContent.trim(),worldMode.textContent.trim()],
                caveatHidden:refinedHeadlineCaveat.classList.contains('hidden'),
                reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,
                unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,
                title:pageTitle.textContent.trim(),
              }));
              ok(restored.labels[0]==='Gulf routes'&&restored.labels[1]==='Whole world'&&restored.caveatHidden,'Original controls failed to restore',restored);
              ok(restored.reported===0&&restored.unreported===0&&restored.title==='Gulf oil evidence','Original map/view failed to restore',restored);
              const before=await p.$eval('#timeline',e=>+e.value); await p.click('#playButton'); await sleep(700);
              const after=await p.$eval('#timeline',e=>+e.value); ok(after>before,'Playback failed',{before,after});
              ok(!d.errors.length,'Desktop browser errors',d.errors);
              out.desktop={defaults,gulf,world,restored,playback:{before,after}};
              await p.close();

              const m=await open(browser,390,844),mp=m.page; await mp.click('#refinedStream'); await setDate(mp,'2026-06-15');
              await mp.waitForFunction(()=>phaseTitle.textContent.includes('48% below'));
              const mobile=await mp.evaluate(()=>({
                labels:[gulfMode.textContent.trim(),worldMode.textContent.trim()],
                caveat:refinedHeadlineCaveat.textContent.trim(),
                title:phaseTitle.textContent.trim(),
                reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,
                unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,
                overflow:document.documentElement.scrollWidth-innerWidth,
                caveatBox:refinedHeadlineCaveat.getBoundingClientRect().toJSON(),
              }));
              ok(mobile.labels[0]==='Gulf reported exports'&&mobile.labels[1]==='Global refinery output','Mobile labels failed',mobile);
              ok(mobile.title==='Reported exports are 48% below September 2025'&&mobile.reported===3&&mobile.unreported===5,'Mobile meaning layer failed',mobile);
              ok(mobile.overflow<=0&&mobile.caveatBox.width>100,'Mobile layout failed',mobile);
              ok(!m.errors.length,'Mobile browser errors',m.errors);
              out.mobile=mobile; await mp.screenshot({path:'qa/mobile-gulf-clarity.png',fullPage:true}); await mp.close();
              fs.writeFileSync('qa/browser-qa.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
            }finally{await browser.close()}
          })().catch(e=>{out.errors.push(e.stack||String(e));fs.writeFileSync('qa/browser-qa.json',JSON.stringify(out,null,2));console.error(e);process.exit(1)});
          JS
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/oil-clarity-qa.cjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oil-clarity-preview-qa
          path: qa
          retention-days: 3
          if-no-files-found: warn
