name: M1 kiosk final browser QA

on:
  push:
    branches:
      - agent/m1-kiosk-branding
    paths:
      - .github/workflows/m1-kiosk-visual-qa-final.yml

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REV_BEFORE_URL: https://gib-live.netlify.app/m1/
      REV_AFTER_URL: https://deploy-preview-72--gib-live.netlify.app/m1/?ntl-drawer-state=hidden
      RICHMOND_BEFORE_URL: https://gib-richmond-live.netlify.app/m1/
      RICHMOND_AFTER_URL: https://deploy-preview-73--gib-live.netlify.app/m1/?ntl-drawer-state=hidden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare the public-browser harness
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.17.0
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/m1-kiosk-visual-qa.mjs')
          source = path.read_text(encoding='utf-8')

          old_endpoint = "includes('/api/m1-sync')"
          if source.count(old_endpoint) != 2:
              raise SystemExit('sync endpoint harness anchor drifted')
          source = source.replace(old_endpoint, "includes('/api/m1-kiosk-sync')")

          old_validation = (
              "  assert.match(value || '', /^https:\\/\\/[a-z0-9.-]+\\.netlify\\.app\\/m1\\/$/u, "
              "`${name} URL must be an exact Netlify M1 URL.`);"
          )
          new_validation = (
              "  assert.match(value || '', /^https:\\/\\/[a-z0-9.-]+\\.netlify\\.app\\/m1\\/"
              "(?:\\?ntl-drawer-state=hidden)?$/u, `${name} URL must be an exact Netlify M1 URL.`);"
          )
          if source.count(old_validation) != 1:
              raise SystemExit('URL validation harness anchor drifted')
          source = source.replace(old_validation, new_validation)

          old_admin = (
              "  const response = await page.goto(new URL('admin/', url).href, "
              "{ waitUntil: 'networkidle2', timeout: 60_000 });"
          )
          new_admin = (
              "  const adminUrl = new URL('admin/', url);\n"
              "  adminUrl.searchParams.set('ntl-drawer-state', 'hidden');\n"
              "  const response = await page.goto(adminUrl.href, "
              "{ waitUntil: 'networkidle2', timeout: 60_000 });"
          )
          if source.count(old_admin) != 1:
              raise SystemExit('Admin URL harness anchor drifted')
          path.write_text(source.replace(old_admin, new_admin), encoding='utf-8')
          PY
      - name: Wait for exact public review URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in "$REV_BEFORE_URL" "$REV_AFTER_URL" "$RICHMOND_BEFORE_URL" "$RICHMOND_AFTER_URL"; do
            ready=''
            for attempt in $(seq 1 60); do
              status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$url" || true)"
              if [ "$status" = '200' ]; then
                ready='yes'
                break
              fi
              sleep 5
            done
            test "$ready" = 'yes'
          done
      - name: Exercise instructor and Admin flows
        run: node tools/m1-kiosk-visual-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-kiosk-browser-qa-final
          path: artifacts/m1-kiosk-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Remove one-shot QA files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m1-kiosk-visual-qa.yml
          rm .github/workflows/m1-kiosk-visual-qa-final.yml
          rm tools/m1-kiosk-visual-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m1-kiosk-visual-qa.yml .github/workflows/m1-kiosk-visual-qa-final.yml tools/m1-kiosk-visual-qa.mjs
          git commit -m 'chore(m1): complete public kiosk browser QA'
          git push origin HEAD:agent/m1-kiosk-branding
