name: M1 Required

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m1-required:
    name: M1 Required
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enforce M1 incident source isolation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          git diff --check "$base_sha"...HEAD
          test "$(git rev-parse "$base_sha:m1/index.html")" = "$(git rev-parse "HEAD:m1/index.html")"

          unexpected="$(
            git diff --name-only "$base_sha"...HEAD |
              grep -Ev '^(\.gitignore|\.github/workflows/m1-admin-only-required.yml|docs/m1-kiosk-sync-incident-runbook.md|_headers|_redirects|guests/index.html|integrations/google-apps-script/GibM1Receiver.gs|m1/admin/index.html|m1/shared-schedule.json|m1/tablet-diagnostic.html|netlify.toml|netlify/functions/_lib/m1-common.mjs|netlify/functions/m1-admin-(login|logout|review|search|add).mjs|netlify/functions/m1-admin-tablet-diagnostic.mjs|tests/m1-(admin-only|recovery).test.mjs|tests/m1-tablet-diagnostic-secret-safe.test.mjs|tools/m1-recovery.mjs)$' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-Admin files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused M1 tests
        run: node --test tests/m1-admin-only.test.mjs tests/m1-recovery.test.mjs tests/m1-tablet-diagnostic-secret-safe.test.mjs
