name: M1 Required

on:
  pull_request:
    branches:
      - main
      - agent/m1-revbjjops-test-path
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m1-required:
    name: M1 Required
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Verify immutable TEST baseline and candidate diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          proven_test_commit="a0273e4d154cc0289a0a3e10169135fca53b1b23"
          git cat-file -e "$proven_test_commit^{commit}"

          if [ "$PR_BASE_REF" = "agent/m1-revbjjops-test-path" ]; then
            test "$PR_BASE_SHA" = "$proven_test_commit"
          fi

          git diff --check "$proven_test_commit"...HEAD

          while read -r expected path; do
            actual="$(git rev-parse "$proven_test_commit:$path")"
            test "$actual" = "$expected"
          done <<'EOF'
          642981a1f6cacac1aea973818b3812242eb697ed m1/index.html
          c821963300d74ea2d17364d1595964c5b6bfadd1 m1/sync-core.mjs
          1579eab6bf390bb4f9f068b78f471be2fa041319 netlify/functions/m1-kiosk-sync.mjs
          89b2a49348fce2a30b81adcb7ca988ad70f26988 integrations/google-apps-script/Code.gs
          5d0a46d128299ddddb14475a78fa96bcd91c1eba integrations/google-apps-script/GibM1Receiver.gs
          d41f74bcbf95288dd59bbda303d477b57cf4bce4 integrations/google-apps-script/appsscript.json
          7e406f0056e2b1119ecf91a7c449381e13063981 m1/admin/index.html
          b5de1709385315753d8983b6bbfa07b2bad55686 m1/tablet-diagnostic.html
          d11d723ef192be85f09dd58e112ade0dada63575 netlify/functions/m1-admin-tablet-diagnostic.mjs
          EOF

      - name: Install pinned dependencies
        run: npm ci

      - name: Run proven TEST regression suite against candidate
        env:
          PROVEN_TEST_COMMIT: a0273e4d154cc0289a0a3e10169135fca53b1b23
        run: |
          baseline_suite="$(mktemp -d "$PWD/.m1-proven-tests.XXXXXX")"
          trap 'rm -rf "$baseline_suite"' EXIT
          git archive "$PROVEN_TEST_COMMIT" tests |
            tar -x --strip-components=1 -C "$baseline_suite"
          node --test "$baseline_suite"/m1-*.test.mjs

      - name: Run all candidate M1 tests
        run: node --test tests/m1-*.test.mjs
