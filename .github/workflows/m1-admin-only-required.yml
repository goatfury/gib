name: M1 Required

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m1-required:
    name: M1 Required
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enforce M1 incident source isolation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ]; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          git diff --check "$base_sha"...HEAD
          test "$(git rev-parse "HEAD:m1/index.html")" = "c522ca681dc8ddd22407e9b7e13f2f46d9b937ad"
          test "$(git rev-parse "HEAD:m1/sync-core.mjs")" = "c821963300d74ea2d17364d1595964c5b6bfadd1"
          test "$(git rev-parse "HEAD:netlify/functions/m1-kiosk-sync.mjs")" = "a1c8d9e0d61f962b5d151b82e7cdefe48db0fa20"
          test "$(git rev-parse "HEAD:integrations/google-apps-script/Code.gs")" = "89b2a49348fce2a30b81adcb7ca988ad70f26988"
          test "$(git rev-parse "HEAD:integrations/google-apps-script/GibM1Receiver.gs")" = "d20cbe5e02d8c4898765c793351c0860aff00e10"
          test "$(git rev-parse "HEAD:integrations/google-apps-script/appsscript.json")" = "d41f74bcbf95288dd59bbda303d477b57cf4bce4"
          test "$(git rev-parse "HEAD:m1/admin/index.html")" = "7e406f0056e2b1119ecf91a7c449381e13063981"
          test "$(git rev-parse "HEAD:m1/tablet-diagnostic.html")" = "b5de1709385315753d8983b6bbfa07b2bad55686"
          test "$(git rev-parse "HEAD:netlify/functions/m1-admin-tablet-diagnostic.mjs")" = "6fe94bea77703d8fe8055bf05fd2215d600de647"

          unexpected="$(
            git diff --name-only "$base_sha"...HEAD |
              grep -Ev '^(\.gitignore|\.github/workflows/m1-admin-only-required.yml|docs/m1-kiosk-sync-incident-runbook.md|_headers|_redirects|guests/index.html|integrations/google-apps-script/(\.claspignore|\.gitignore|Code\.gs|GibM1Receiver\.gs|appsscript\.json)|m1/admin/index.html|m1/(index\.html|sync-core\.mjs)|m1/shared-schedule.json|m1/tablet-diagnostic.html|netlify.toml|netlify/functions/_lib/m1-common.mjs|netlify/functions/m1-admin-(login|logout|review|search|add).mjs|netlify/functions/m1-admin-tablet-diagnostic.mjs|netlify/functions/m1-kiosk-sync.mjs|tests/m1-(admin-only|kiosk-client|kiosk-sync-function|recovery|test-receiver)\.test\.mjs|tests/m1-tablet-diagnostic-secret-safe\.test\.mjs|tools/m1-recovery.mjs)$' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-Admin files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused M1 tests
        run: node --test tests/m1-*.test.mjs
