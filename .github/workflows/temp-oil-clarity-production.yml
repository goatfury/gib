name: Temporary promote Oil Atlas clarity pass to production

on:
  pull_request:
    branches:
      - oil-flow-atlas

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 1064d737960a76b55bdc5a4f8b696af3acfd4ab3
      SITE_ID: c7c4e406-ce88-4b7f-a9a0-dd21e365afad
      SITE_URL: https://oil-flow-atlas.netlify.app
      EXPECTED_HTML_SHA: c3b4e0fb21d625242aad33357be69708fc89b741e339859e34f66cb428b83fd4
      EXPECTED_JS_SHA: f5682132744f5e24ebe0fe4832cb7dc61d82e2c80699215855cf5c8ae8d65a01
      EXPECTED_CSS_SHA: 19604702e51560836802f635c24eb2df05e7c7cbcd0052ef08548379475e4a1b
      PROXY_PATH: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..8H4xVubaQvnA7dVw.AWG-q3p2E9MToUPbCeekH43Y1soAI93FckvdbTwat_JQ16MiqUGWlMKwDSclkpNDxbdKh_9Pp_0n5hHtgHGSfNI45LUtSwE38fXe9xQy1NXMg8w5rLA6ae0Jf1QM7Rz-JeSuCRwPA37esw-caRmWqJMzCxxnelQfJTNOQ_2XbCa3FZ4D9Jo7EAVap4klT-8n3yXbLT71mrCRbcu_zcoCjMyU4sUTaYEFJrlBfDK1Ps7tP8hdOTQ96nmjAU1T_XA5iS2oCK7ao5mw2UkHDx354LzpTi0jPduCUXdjRt459Wb3ST2Fc819k2rLYiezcMoYVgqNyEkoY077IPJ8wM-7L7yr04VE52ccd2IDeMlZUBUjw5Ze9rjehvGym3EUDvKaPlhOHrkZ.cc3YB-eeXmUy6kmyhNl0Sg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Rebuild and verify the preview-approved artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          npm install --no-audit --no-fund
          node build-audited.mjs | tee qa/build.log
          node --test tests/*.test.mjs | tee qa/tests.log
          node --check public/clarity.js
          echo "$EXPECTED_HTML_SHA  public/index.html" | sha256sum -c -
          echo "$EXPECTED_JS_SHA  public/clarity.js" | sha256sum -c -
          echo "$EXPECTED_CSS_SHA  public/clarity.css" | sha256sum -c -

      - name: Deploy the exact approved artifact to production
        shell: bash
        run: |
          set -euo pipefail
          npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH" | tee qa/deploy.log
          for attempt in $(seq 1 72); do
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/?identity=$RANDOM-$attempt" -o qa/live-index.html || true
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/clarity.js?identity=$RANDOM-$attempt" -o qa/live-clarity.js || true
            curl -fsSL -H 'Accept-Encoding: identity' "$SITE_URL/clarity.css?identity=$RANDOM-$attempt" -o qa/live-clarity.css || true
            html="$(sha256sum qa/live-index.html 2>/dev/null | awk '{print $1}')"
            js="$(sha256sum qa/live-clarity.js 2>/dev/null | awk '{print $1}')"
            css="$(sha256sum qa/live-clarity.css 2>/dev/null | awk '{print $1}')"
            echo "attempt=$attempt html=$html js=$js css=$css"
            if [ "$html" = "$EXPECTED_HTML_SHA" ] && [ "$js" = "$EXPECTED_JS_SHA" ] && [ "$css" = "$EXPECTED_CSS_SHA" ]; then break; fi
            sleep 5
          done
          test "$(sha256sum qa/live-index.html | awk '{print $1}')" = "$EXPECTED_HTML_SHA"
          test "$(sha256sum qa/live-clarity.js | awk '{print $1}')" = "$EXPECTED_JS_SHA"
          test "$(sha256sum qa/live-clarity.css | awk '{print $1}')" = "$EXPECTED_CSS_SHA"

      - name: Browser QA production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          cat > /tmp/qa.cjs <<'JS'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          const site=process.env.SITE_URL,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out={site,desktop:{},mobile:{},errors:[]};
          const ok=(x,m,d)=>{if(!x)throw new Error(`${m} — ${JSON.stringify(d)}`)};
          async function open(browser,width,height){const page=await browser.newPage();await page.setViewport({width,height});const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('requestfailed',r=>{const e=r.failure()?.errorText||'';if(!e.includes('ERR_ABORTED'))errors.push(`request:${r.url()} ${e}`)});await page.goto(`${site}/?qa=${Date.now()}`,{waitUntil:'networkidle0',timeout:60000});await page.waitForSelector('#refinedStream',{timeout:20000});await page.evaluate(()=>document.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})));await sleep(300);return{page,errors}}
          async function setDate(page,iso){await page.evaluate(iso=>{const s=Date.parse('2025-09-01T00:00:00Z'),t=timeline;t.value=String(Math.round((Date.parse(iso+'T00:00:00Z')-s)/86400000));t.dispatchEvent(new Event('input',{bubbles:true}))},iso);await sleep(250)}
          (async()=>{const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{
            const d=await open(browser,1440,900),p=d.page;
            await p.click('#refinedStream');await setDate(p,'2026-06-15');await p.waitForFunction(()=>phaseTitle.textContent.includes('48% below'));
            const gulf=await p.evaluate(()=>({g:gulfMode.textContent.trim(),w:worldMode.textContent.trim(),c:refinedHeadlineCaveat.textContent.trim(),v:parseFloat(flowNumber.textContent),title:phaseTitle.textContent.trim(),take:phaseText.textContent.trim(),key:refinedCoverage.textContent.replace(/\s+/g,' ').trim(),reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,overflow:document.documentElement.scrollWidth-innerWidth}));
            ok(gulf.g==='Gulf reported exports'&&gulf.w==='Global refinery output','Production labels failed',gulf);ok(gulf.c==='Saudi Arabia, Kuwait and Bahrain only — not a Gulf total.','Production Gulf caveat failed',gulf);ok(Math.abs(gulf.v-1.608)<.06&&gulf.title==='Reported exports are 48% below September 2025','Production Gulf readout failed',gulf);ok(gulf.take.includes('Kuwait has rebounded from April')&&gulf.reported===3&&gulf.unreported===5&&gulf.key.includes('hatched = unreported')&&gulf.overflow<=0,'Production Gulf map/takeaway failed',gulf);
            await p.screenshot({path:'qa/production-desktop-gulf.png',fullPage:true});
            await p.click('#worldMode');await setDate(p,'2026-06-15');await p.waitForFunction(()=>phaseTitle.textContent.includes('2% below'));
            const world=await p.evaluate(()=>({c:refinedHeadlineCaveat.textContent.trim(),v:parseFloat(flowNumber.textContent),title:phaseTitle.textContent.trim(),take:phaseText.textContent.trim(),overflow:document.documentElement.scrollWidth-innerWidth}));
            ok(world.c==='Fixed 47-country reporting cohort — not a world total.','Production World caveat failed',world);ok(Math.abs(world.v-63.3139)<.06&&world.title==='Reported refinery output is 2% below September 2025','Production World readout failed',world);ok(world.take.includes('U.S. is the largest increase')&&world.take.includes('Asia-Pacific is the largest decline')&&world.overflow<=0,'Production World takeaway failed',world);
            await p.click('#liquidsStream');await p.click('#gulfMode');await sleep(250);const restored=await p.evaluate(()=>({g:gulfMode.textContent.trim(),w:worldMode.textContent.trim(),hidden:refinedHeadlineCaveat.classList.contains('hidden'),reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,title:pageTitle.textContent.trim()}));ok(restored.g==='Gulf routes'&&restored.w==='Whole world'&&restored.hidden&&restored.reported===0&&restored.unreported===0&&restored.title==='Gulf oil evidence','Production original view failed to restore',restored);
            const before=await p.$eval('#timeline',e=>+e.value);await p.click('#playButton');await sleep(700);const after=await p.$eval('#timeline',e=>+e.value);ok(after>before,'Production playback failed',{before,after});ok(!d.errors.length,'Production desktop errors',d.errors);out.desktop={gulf,world,restored,playback:{before,after}};await p.close();
            const m=await open(browser,390,844),mp=m.page;await mp.click('#refinedStream');await setDate(mp,'2026-06-15');await mp.waitForFunction(()=>phaseTitle.textContent.includes('48% below'));const mobile=await mp.evaluate(()=>({g:gulfMode.textContent.trim(),w:worldMode.textContent.trim(),c:refinedHeadlineCaveat.textContent.trim(),title:phaseTitle.textContent.trim(),reported:document.querySelectorAll('#gulfMap .refined-reported-land').length,unreported:document.querySelectorAll('#gulfMap .refined-unreported-land').length,overflow:document.documentElement.scrollWidth-innerWidth,width:refinedHeadlineCaveat.getBoundingClientRect().width}));ok(mobile.g==='Gulf reported exports'&&mobile.w==='Global refinery output'&&mobile.title==='Reported exports are 48% below September 2025','Production mobile labels/readout failed',mobile);ok(mobile.reported===3&&mobile.unreported===5&&mobile.overflow<=0&&mobile.width>100,'Production mobile map/layout failed',mobile);ok(!m.errors.length,'Production mobile errors',m.errors);out.mobile=mobile;await mp.screenshot({path:'qa/production-mobile-gulf.png',fullPage:true});await mp.close();
            fs.writeFileSync('qa/production-browser-qa.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          }finally{await browser.close()}})().catch(e=>{out.errors.push(e.stack||String(e));fs.writeFileSync('qa/production-browser-qa.json',JSON.stringify(out,null,2));console.error(e);process.exit(1)});
          JS
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/qa.cjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oil-clarity-production-qa
          path: qa
          retention-days: 3
          if-no-files-found: warn
