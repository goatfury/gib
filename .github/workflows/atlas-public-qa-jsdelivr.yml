name: Atlas public QA jsDelivr

on:
  push:
    branches: [atlas-recall-v2-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
      - name: Test exact public URL
        env:
          TARGET_URL: https://cdn.jsdelivr.net/gh/goatfury/gib@417704099b33d462f59139c695e3885de19b1641/previews/atlas-recall-verified/index.html
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const url=process.env.TARGET_URL;
          fs.mkdirSync('public-qa-jsdelivr',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const results={url,checkedAt:new Date().toISOString(),checks:[]};

          async function openPage(viewport={width:1366,height:768},mobile=false){
            const context=await browser.newContext({viewport,isMobile:mobile});
            const page=await context.newPage();
            const errors=[],badResponses=[];
            page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
            page.on('response',r=>{if(r.status()>=400)badResponses.push(`${r.status()} ${r.url()}`)});
            try{
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              results.httpStatus=response?.status()??null;
              await page.waitForFunction(()=>window.__atlasIntegratedReady===true,null,{timeout:30000});
              await page.locator('#answerInput').waitFor({state:'visible',timeout:10000});
            }catch(error){
              await page.screenshot({path:'public-qa-jsdelivr/00-load-failure.png',fullPage:true}).catch(()=>{});
              fs.writeFileSync('public-qa-jsdelivr/load-failure.html',await page.content().catch(()=>''));
              fs.writeFileSync('public-qa-jsdelivr/network.json',JSON.stringify({errors,badResponses},null,2));
              throw error;
            }
            return{context,page,errors,badResponses};
          }

          try{
            {
              const{context,page,errors,badResponses}=await openPage();
              assert.equal((await page.locator('#zoomReadout').innerText()).trim(),'100%');
              assert.match((await page.locator('#oddHintBtn').innerText()).trim(),/^Hint/);
              assert.equal(await page.locator('#capitalPanel').isVisible(),false);
              await page.screenshot({path:'public-qa-jsdelivr/01-initial.png',fullPage:true});
              assert.deepEqual(errors,[]);assert.deepEqual(badResponses,[]);
              results.checks.push('renders at 100% world view with one field and visible Hint button');
              await context.close();
            }
            {
              const{context,page,errors,badResponses}=await openPage();const input=page.locator('#answerInput');
              await input.fill('Canada');
              await page.waitForFunction(()=>document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'),null,{timeout:10000});
              assert.match(await input.getAttribute('placeholder'),/Canada/);
              await page.locator('#oddHintBtn').click();
              await page.waitForFunction(()=>document.querySelector('.learning-hint-badge')?.textContent.startsWith('Capital: O'));
              await page.locator('#oddHintBtn').click();
              await page.waitForFunction(()=>document.querySelector('.learning-hint-badge')?.textContent.startsWith('Capital: Ot'));
              await page.screenshot({path:'public-qa-jsdelivr/02-hint.png',fullPage:true});
              await input.fill('France');
              await page.waitForFunction(()=>document.querySelector('#scoreStat')?.textContent.trim().startsWith('2 /'),null,{timeout:10000});
              assert.match(await input.getAttribute('placeholder'),/France/);assert.match(await page.locator('#feedback').innerText(),/Ottawa/);
              await page.screenshot({path:'public-qa-jsdelivr/03-next-country.png',fullPage:true});
              assert.deepEqual(errors,[]);assert.deepEqual(badResponses,[]);
              results.checks.push('Canada -> Ottawa prompt -> O -> Ot -> France -> skipped Ottawa reveal');
              await context.close();
            }
            {
              const{context,page,errors,badResponses}=await openPage();const input=page.locator('#answerInput');
              await input.fill('South Africa');
              await page.waitForFunction(()=>document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'),null,{timeout:10000});
              await input.fill('Pretora');
              await page.waitForFunction(()=>document.querySelector('#matchCue')?.textContent.includes('press Enter'),null,{timeout:10000});
              assert.match((await page.locator('#remainingStat').innerText()).trim(),/^0 \/ 197/);
              await input.press('Enter');
              await page.waitForFunction(()=>document.querySelector('#feedback')?.textContent.includes('Pretoria')&&document.querySelector('#feedback')?.textContent.includes('Pretora'));
              assert.match((await page.locator('#remainingStat').innerText()).trim(),/^1 \/ 197/);
              await page.screenshot({path:'public-qa-jsdelivr/04-spelling.png',fullPage:true});
              assert.deepEqual(errors,[]);assert.deepEqual(badResponses,[]);
              results.checks.push('Pretora requires Enter and teaches Pretoria');
              await context.close();
            }
            {
              const{context,page,errors,badResponses}=await openPage();
              await page.locator('#answerInput').fill('Canada');
              await page.waitForFunction(()=>document.querySelector('#scoreStat')?.textContent.trim().startsWith('1 /'),null,{timeout:10000});
              await page.locator('#giveUpBtn').click();await page.locator('#confirmOkay').click();
              await page.waitForFunction(()=>document.querySelector('#reviewDialog')?.hasAttribute('open'),null,{timeout:10000});
              assert.equal((await page.locator('#reviewTitle').innerText()).trim(),'Complete answer key');
              assert.equal(await page.locator('.answer-key-card').count(),197);
              assert.match(await page.locator('.answer-key-card',{hasText:'Canada'}).first().innerText(),/Ottawa/);
              await page.screenshot({path:'public-qa-jsdelivr/05-answer-key.png',fullPage:true});
              assert.deepEqual(errors,[]);assert.deepEqual(badResponses,[]);
              results.checks.push('finish opens all 197 country-capital answers');
              await context.close();
            }
            {
              const{context,page,errors,badResponses}=await openPage({width:390,height:844},true);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              assert.ok(overflow<=1,`horizontal overflow ${overflow}px`);assert.match((await page.locator('#oddHintBtn').innerText()).trim(),/^Hint/);
              await page.screenshot({path:'public-qa-jsdelivr/06-mobile.png',fullPage:true});
              assert.deepEqual(errors,[]);assert.deepEqual(badResponses,[]);
              results.checks.push('390px mobile has no horizontal overflow');
              await context.close();
            }
            results.status='passed';fs.writeFileSync('public-qa-jsdelivr/results.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results,null,2));
          }catch(error){results.status='failed';results.error=error.stack||String(error);fs.writeFileSync('public-qa-jsdelivr/results.json',JSON.stringify(results,null,2));throw error}
          finally{await browser.close()}
          EOF
          node qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-public-qa-jsdelivr
          path: public-qa-jsdelivr
          if-no-files-found: error
